<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.08) 38%, rgba(11,31,51,0.78) 54%, rgba(11,31,51,0.93) 100%); }
      .panel { position: absolute; left: 1020px; top: 0; width: 860px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 100px; color: #d4a24c; font-weight: 800; font-size: 34px; letter-spacing: 0.16em; }
      .t1 { position: absolute; left: 0; top: 148px; color: #fff; font-weight: 800; font-size: 108px; line-height: 1.02; letter-spacing: -0.02em; }
      .t2 { position: absolute; left: 0; top: 258px; color: #d4a24c; font-weight: 800; font-size: 100px; line-height: 1.02; letter-spacing: -0.02em; }
      svg.fly { position: absolute; left: 0; top: 400px; width: 840px; height: 460px; overflow: visible; }
      .lab { position: absolute; color: #fff; font-weight: 800; font-size: 36px; white-space: nowrap; }
      .lab small { display: block; color: #d4a24c; font-weight: 500; font-size: 28px; }
      .bar { position: absolute; left: 0; top: 896px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
      .facts { position: absolute; left: 0; top: 922px; width: 860px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 860px; color: #fff; font-weight: 800; font-size: 52px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="4.6" data-track-index="0"><img id="im1" src="assets/s1.jpg" alt="" /></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="3.8" data-duration="4.4" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/s2.jpg" alt="" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="7.4" data-duration="4.6" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/s3.jpg" alt="" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="10.8" data-duration="1.2" data-track-index="3"><img id="im5" src="assets/s1.jpg" alt="" /></div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="4" style="position:absolute;inset:0">
        <div class="shade"></div>
        <div class="panel">
          <div class="kicker">AIR · BILASPUR, HIMACHAL</div>
          <div class="t1">Paragliding</div>
          <div class="t2">in Bilaspur</div>
          <svg class="fly" viewBox="0 0 840 460">
            <path d="M 0 260 L 40 200 Q 90 120 140 130 Q 190 140 230 220 Q 280 300 340 330 L 840 330" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            <g fill="rgba(255,255,255,0.85)">
              <rect x="300" y="300" width="20" height="26" /><rect x="328" y="292" width="24" height="34" /><rect x="360" y="304" width="22" height="22" /><rect x="390" y="296" width="18" height="30" /><rect x="416" y="306" width="26" height="20" />
            </g>
            <path d="M 560 342 Q 700 336 840 342 L 840 396 Q 700 404 560 386 Z" fill="rgba(110,170,220,0.55)" />
            <path d="M 580 360 Q 650 356 720 362 M 640 378 Q 720 374 800 380" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" />
            <path id="route" d="M 140 112 C 260 60 330 200 430 190 C 530 180 560 270 620 318" fill="none" stroke="#d4a24c" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16" />
            <circle cx="140" cy="128" r="13" fill="#d4a24c" stroke="#0b1f33" stroke-width="4" />
            <circle id="land" cx="626" cy="334" r="11" fill="#ffffff" stroke="#0b1f33" stroke-width="4" />
            <g id="glider">
              <path d="M -30 -12 Q 0 -34 30 -12" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" />
              <line x1="-24" y1="-13" x2="0" y2="11" stroke="#fff" stroke-width="2.5" />
              <line x1="24" y1="-13" x2="0" y2="11" stroke="#fff" stroke-width="2.5" />
              <circle cx="-4" cy="13" r="6" fill="#d4a24c" />
              <circle cx="5" cy="15" r="6" fill="#ffffff" />
            </g>
          </svg>
          <div class="lab" style="left:0px; top:690px">Bandla Dhar<small>take-off</small></div>
          <div class="lab" style="left:270px; top:752px">Bilaspur town</div>
          <div class="lab" style="left:560px; top:808px">Gobind Sagar<small>land at Luhnu</small></div>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">Land beside the lake</div>
            <div class="fact" id="f2">Tandem · registered pilot</div>
            <div class="fact" id="f3">Closed in the monsoon</div>
            <div class="fact" id="f4">Age 12+ · 30 kg+</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.08, x: -30, duration: 4.6, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.08, x: 20 }, { scale: 1, x: -20, duration: 4.4, ease: "none" }, 3.8);
      tl.fromTo("#im3", { scale: 1, y: 0 }, { scale: 1.07, y: -20, duration: 4.6, ease: "none" }, 7.4);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 3.8);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 7.4);
      tl.fromTo("#im5", { opacity: 0 }, { opacity: 1, duration: 1.15, ease: "sine.inOut" }, 10.8);

      const route = document.getElementById("route");
      const L = route.getTotalLength();
      const glider = document.getElementById("glider");
      const NS = "http://www.w3.org/2000/svg";
      const trail = document.createElementNS(NS, "path");
      trail.setAttribute("d", route.getAttribute("d"));
      trail.setAttribute("fill", "none"); trail.setAttribute("stroke", "#d4a24c"); trail.setAttribute("stroke-width", "6"); trail.setAttribute("stroke-linecap", "round");
      trail.style.strokeDasharray = L + " " + L; trail.style.strokeDashoffset = String(L);
      route.parentNode.insertBefore(trail, route.nextSibling);
      function put(t) {
        const a = route.getPointAtLength(L * t);
        const b = route.getPointAtLength(Math.min(L, L * t + 2));
        const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
        glider.setAttribute("transform", "translate(" + a.x.toFixed(2) + "," + (a.y - 26).toFixed(2) + ") rotate(" + (ang * 0.25).toFixed(2) + ")");
        trail.style.strokeDashoffset = String(L * (1 - t));
      }
      put(0);
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: 1, duration: 9.6, ease: "sine.inOut", immediateRender: false, onUpdate: () => put(st.t) }, 0.6);
      tl.fromTo("#land", { attr: { fill: "#ffffff" } }, { attr: { fill: "#d4a24c" }, duration: 0.3, immediateRender: false }, 10.2);
      tl.to(["#glider"], { opacity: 0, duration: 0.4, ease: "power1.in" }, 10.7);
      tl.to(trail, { opacity: 0, duration: 0.5 }, 10.8);
      tl.to("#land", { attr: { fill: "#ffffff" }, duration: 0.4 }, 11.0);
      const rs = { t: 1 };
      tl.fromTo(rs, { t: 1 }, { t: 0, duration: 0.01, immediateRender: false, onUpdate: () => put(rs.t) }, 11.3);
      tl.set(trail, { opacity: 1 }, 11.35);
      tl.to("#glider", { opacity: 1, duration: 0.55, ease: "power1.out" }, 11.4);

      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 2.6], ["#f2", "#f3", 5.4], ["#f3", "#f4", 8.2], ["#f4", "#f1", 11.0]];
      seq.forEach(([a, b, t]) => {
        tl.to(a, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
