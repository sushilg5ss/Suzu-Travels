<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.08) 38%, rgba(11,31,51,0.8) 54%, rgba(11,31,51,0.94) 100%); }
      .panel { position: absolute; left: 1020px; top: 0; width: 860px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 100px; color: #d4a24c; font-weight: 800; font-size: 30px; letter-spacing: 0.12em; white-space: nowrap; }
      .t1 { position: absolute; left: 0; top: 148px; color: #fff; font-weight: 800; font-size: 108px; line-height: 1.02; letter-spacing: -0.02em; }
      .t2 { position: absolute; left: 0; top: 258px; color: #d4a24c; font-weight: 800; font-size: 108px; line-height: 1.02; letter-spacing: -0.02em; }
      svg.cable { position: absolute; left: 0; top: 400px; width: 840px; height: 440px; overflow: visible; }
      .bar { position: absolute; left: 0; top: 896px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
      .facts { position: absolute; left: 0; top: 922px; width: 860px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 860px; color: #fff; font-weight: 800; font-size: 52px; white-space: nowrap; }
      .lbl { position: absolute; white-space: nowrap; font-weight: 800; font-size: 28px; letter-spacing: 0.08em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="4.6" data-track-index="0"><img id="im1" src="assets/s1.jpg" alt="" /></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="3.8" data-duration="4.4" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/s2.jpg" alt="" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="7.4" data-duration="4.6" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/s3.jpg" alt="" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="10.8" data-duration="1.2" data-track-index="3"><img id="im5" src="assets/s1.jpg" alt="" /></div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="4" style="position:absolute;inset:0">
        <div class="shade"></div>
        <div class="panel">
          <div class="kicker">ROPEWAYS · SHIMLA · DHARAMSHALA · MANALI</div>
          <div class="t1">Ropeways in</div>
          <div class="t2">Himachal</div>
          <svg class="cable" viewBox="0 0 840 440">
            <line x1="40" y1="300" x2="800" y2="20" stroke="rgba(255,255,255,0.35)" stroke-width="3" />
            <line x1="40" y1="300" x2="800" y2="20" stroke="#d4a24c" stroke-width="5" stroke-linecap="round" />
            <g fill="none" stroke="#ffffff" stroke-width="4">
              <path d="M 20 360 L 40 300 L 60 360" />
              <path d="M 780 80 L 800 20 L 820 80" />
            </g>
            <circle cx="40" cy="300" r="9" fill="#d4a24c" />
            <circle cx="800" cy="20" r="9" fill="#d4a24c" />
            <g id="cabin">
              <line x1="0" y1="0" x2="0" y2="34" stroke="#ffffff" stroke-width="4" />
              <circle cx="0" cy="0" r="7" fill="#ffffff" />
              <rect x="-42" y="34" width="84" height="66" rx="12" fill="#d4a24c" />
              <rect x="-32" y="44" width="28" height="26" rx="4" fill="#0b1f33" />
              <rect x="4" y="44" width="28" height="26" rx="4" fill="#0b1f33" />
            </g>
          </svg>
          <div class="lbl" style="left:100px;top:728px;color:#fff">LOWER STATION</div>
          <div class="lbl" style="left:0px;top:410px;color:#d4a24c">TOP: UP TO ~3,200 M</div>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">5 ropeways running</div>
            <div class="fact" id="f2">Longest: Skyway 1.8 km</div>
            <div class="fact" id="f3">Solang top ~3,200 m</div>
            <div class="fact" id="f4">Ride early: wind stops cables</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.08, x: -30, duration: 4.6, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.08, x: 20 }, { scale: 1, x: -20, duration: 4.4, ease: "none" }, 3.8);
      tl.fromTo("#im3", { scale: 1, y: 0 }, { scale: 1.07, y: -20, duration: 4.6, ease: "none" }, 7.4);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 3.8);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 7.4);
      tl.fromTo("#im5", { opacity: 0 }, { opacity: 1, duration: 1.15, ease: "sine.inOut" }, 10.8);

      const cabin = document.getElementById("cabin");
      const st = { p: 0 };
      function put() {
        const x = 40 + (800 - 40) * st.p, y = 300 + (20 - 300) * st.p;
        const sway = Math.sin(st.p * Math.PI * 6) * 2.5;
        cabin.setAttribute("transform", "translate(" + x.toFixed(2) + "," + y.toFixed(2) + ") rotate(" + sway.toFixed(2) + ")");
      }
      put();
      tl.fromTo(st, { p: 0 }, { p: 1, duration: 5.4, ease: "sine.inOut", immediateRender: false, onUpdate: put }, 0.3);
      tl.to(st, { p: 0, duration: 5.4, ease: "sine.inOut", onUpdate: put }, 6.3);

      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 2.6], ["#f2", "#f3", 5.2], ["#f3", "#f4", 8.0], ["#f4", "#f1", 11.0]];
      seq.forEach(([a, b, t]) => {
        tl.to(a, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
