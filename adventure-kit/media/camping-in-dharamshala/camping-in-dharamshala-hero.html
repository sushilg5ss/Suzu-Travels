<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.1) 38%, rgba(11,31,51,0.76) 56%, rgba(11,31,51,0.9) 100%); }
      .panel { position: absolute; left: 1040px; top: 0; width: 820px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 136px; color: #d4a24c; font-weight: 800; font-size: 34px; letter-spacing: 0.18em; }
      .t1 { position: absolute; left: 0; top: 200px; color: #fff; font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; }
      .t2 { position: absolute; left: 0; top: 318px; color: #d4a24c; font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; }
      svg.tent { position: absolute; left: 0; top: 470px; width: 820px; height: 360px; overflow: visible; }
      .star { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
      .facts { position: absolute; left: 0; top: 880px; width: 820px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 820px; color: #fff; font-weight: 800; font-size: 46px; white-space: nowrap; }
      .bar { position: absolute; left: 0; top: 860px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="3.8" data-track-index="0"><img id="im1" src="assets/s1.jpg" alt="" /></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="3" data-duration="3.8" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/s2.jpg" alt="" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="6" data-duration="3.8" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/s3.jpg" alt="" /></div></div>
      <div id="sc4" class="scene clip" data-layout-allow-overflow data-start="9" data-duration="3" data-track-index="3"><div id="fd4" style="position:absolute;inset:0"><img id="im4" src="assets/s4.jpg" alt="" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="10.8" data-duration="1.2" data-track-index="4"><img id="im5" src="assets/s1.jpg" alt="" /></div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="5" style="position:absolute;inset:0">
        <div class="shade"></div>
        <div class="panel">
          <div class="kicker">TREKS &amp; CAMPS · KANGRA</div>
          <div class="t1">Camping in</div>
          <div class="t2">Dharamshala</div>
          <svg class="tent" viewBox="0 0 820 360">
            <path d="M 0 330 L 120 250 L 190 290 L 300 200 L 390 262 L 470 210 L 560 270 L 640 230 L 820 320" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="4" stroke-linejoin="round" />
            <path id="tentA" d="M 470 330 L 610 120 L 750 330 Z" fill="rgba(212,162,76,0.12)" stroke="#d4a24c" stroke-width="9" stroke-linejoin="round" />
            <path id="tentB" d="M 610 120 L 575 330 M 610 120 L 645 330" fill="none" stroke="#d4a24c" stroke-width="7" stroke-linecap="round" />
            <path id="ground" d="M 380 330 L 820 330" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" />
            <circle id="glow" cx="610" cy="290" r="34" fill="#d4a24c" opacity="0" />
          </svg>
          <div id="stars">
            <div class="star" style="left:80px;top:500px"></div><div class="star" style="left:190px;top:470px"></div><div class="star" style="left:300px;top:540px"></div>
            <div class="star" style="left:360px;top:460px"></div><div class="star" style="left:120px;top:600px"></div><div class="star" style="left:250px;top:640px"></div>
          </div>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">Forest camps above McLeodganj</div>
            <div class="fact" id="f2">Triund ridge · about 2,850 m</div>
            <div class="fact" id="f3">Kareri Lake trail · 2,934 m</div>
            <div class="fact" id="f4">Best Mar–Jun &amp; Sep–Nov</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.08, x: -30, duration: 3.8, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.08, x: 20 }, { scale: 1, x: -20, duration: 3.8, ease: "none" }, 3);
      tl.fromTo("#im3", { scale: 1, y: 0 }, { scale: 1.07, y: -20, duration: 3.8, ease: "none" }, 6);
      tl.fromTo("#im4", { scale: 1.07, y: 10 }, { scale: 1, y: -10, duration: 3, ease: "none" }, 9);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 3);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 6);
      tl.fromTo("#fd4", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 9);
      tl.fromTo("#im5", { opacity: 0 }, { opacity: 1, duration: 1.15, ease: "sine.inOut" }, 10.8);
      ["#tentA", "#tentB", "#ground"].forEach(function (s) {
        const el = document.querySelector(s);
        const L = el.getTotalLength();
        el.style.strokeDasharray = L + " " + L;
        tl.fromTo(el, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 2.2, ease: "power2.inOut" }, s === "#ground" ? 0.3 : 0.9);
        tl.to(el, { strokeDashoffset: L, duration: 0.8, ease: "power2.in" }, 10.6);
      });
      tl.fromTo("#glow", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 0.55, scale: 1, duration: 1.2, ease: "sine.out" }, 3);
      tl.to("#glow", { opacity: 0.25, duration: 1.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 4.2);
      tl.to("#glow", { opacity: 0, duration: 0.6 }, 10.6);
      document.querySelectorAll("#stars .star").forEach(function (s, i) {
        tl.fromTo(s, { opacity: 0 }, { opacity: 0.9, duration: 0.6, ease: "sine.inOut" }, 1.2 + i * 0.35);
        tl.to(s, { opacity: 0.3, duration: 0.7, yoyo: true, repeat: 5, ease: "sine.inOut" }, 3.5 + i * 0.2);
        tl.to(s, { opacity: 0, duration: 0.5 }, 10.6);
      });
      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 2.6], ["#f2", "#f3", 5.4], ["#f3", "#f4", 8.2], ["#f4", "#f1", 11.0]];
      seq.forEach(([a, b, t]) => {
        tl.to(a, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
