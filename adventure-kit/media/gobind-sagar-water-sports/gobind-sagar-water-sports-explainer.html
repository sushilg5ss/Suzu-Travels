<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; background: #0b1f33; }
      .kick { position: absolute; left: 96px; top: 70px; color: #d4a24c; font-weight: 800; font-size: 34px; letter-spacing: 0.16em; }
      .h { position: absolute; left: 96px; top: 118px; width: 1700px; color: #fff; font-weight: 800; font-size: 76px; letter-spacing: -0.02em; white-space: nowrap; }
      .pane { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      svg.g { position: absolute; left: 96px; top: 250px; width: 1728px; height: 600px; overflow: visible; }
      .chips { position: absolute; left: 96px; top: 930px; width: 1728px; height: 90px; }
      .chip { position: absolute; top: 0; height: 80px; line-height: 80px; padding: 0 34px; border-radius: 40px; font-weight: 800; font-size: 38px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="ttl" class="clip" data-start="0" data-duration="12" data-track-index="0" style="position:absolute;inset:0">
        <div id="kk" class="kick">GOBIND SAGAR · BILASPUR</div>
        <div id="h1" class="h">The lake that rises and falls</div>
        <div id="h2" class="h">Fly Bandla, then get on the water</div>
      </div>
      <div id="p1" class="clip" data-start="0" data-duration="6.8" data-track-index="1" style="position:absolute;inset:0"><div id="p1i" class="pane">
        <svg class="g" viewBox="0 0 1728 600">
          <line x1="0" y1="470" x2="1728" y2="470" stroke="rgba(255,255,255,0.35)" stroke-width="3" />
          <g id="bars"></g>
          <g id="labs" font-family="PJS" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle"></g>
          <g id="anHi">
            <path d="M 1008 40 L 1008 20 L 1728 20 L 1728 40" fill="none" stroke="#d4a24c" stroke-width="5" />
            <path d="M 0 40 L 0 20 L 132 20 L 132 40" fill="none" stroke="#d4a24c" stroke-width="5" />
            <text x="1368" y="-6" fill="#d4a24c" font-family="PJS" font-weight="800" font-size="38" text-anchor="middle">HIGH WATER · BOATS &amp; JET SKIS</text>
          </g>
          <g id="anLo">
            <g transform="translate(468,150)" fill="#ffffff">
              <rect x="-26" y="40" width="52" height="66" />
              <path d="M -34 42 L 0 -12 L 34 42 Z" />
              <rect x="-3" y="-34" width="6" height="24" />
            </g>
            <text x="468" y="110" fill="#ffffff" font-family="PJS" font-weight="800" font-size="38" text-anchor="middle">LOW WATER · OLD TEMPLES SHOW</text>
          </g>
        </svg>
      </div></div>
      <div id="p2" class="clip" data-start="6.4" data-duration="5.6" data-track-index="2" style="position:absolute;inset:0"><div id="p2i" class="pane">
        <svg class="g" viewBox="0 0 1728 600">
          <path d="M 120 520 Q 300 300 520 200 Q 640 150 760 230 Q 840 290 900 440" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="6" stroke-linecap="round" />
          <path d="M 860 440 C 1000 380 1200 400 1360 360 C 1480 330 1600 360 1700 330 L 1700 520 C 1560 540 1400 500 1240 530 C 1100 555 960 540 860 520 Z" fill="rgba(110,170,220,0.6)" />
          <path d="M 960 470 Q 1080 455 1200 470 M 1300 440 Q 1420 428 1540 440" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" />
          <path id="route" d="M 640 170 C 760 60 900 160 940 260 C 970 340 990 400 1000 440" fill="none" stroke="#d4a24c" stroke-width="7" stroke-linecap="round" stroke-dasharray="3 20" />
          <circle cx="640" cy="180" r="16" fill="#d4a24c" stroke="#0b1f33" stroke-width="5" />
          <circle id="m1" cx="1004" cy="452" r="15" fill="#ffffff" stroke="#0b1f33" stroke-width="5" />
          <circle id="m2" cx="1520" cy="400" r="15" fill="#ffffff" stroke="#0b1f33" stroke-width="5" />
          <g id="glider">
            <path d="M -36 -14 Q 0 -42 36 -14" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" />
            <line x1="-29" y1="-15" x2="0" y2="12" stroke="#fff" stroke-width="3" />
            <line x1="29" y1="-15" x2="0" y2="12" stroke="#fff" stroke-width="3" />
            <circle cx="-4" cy="15" r="7" fill="#d4a24c" /><circle cx="6" cy="17" r="7" fill="#fff" />
          </g>
          <g transform="translate(1100,476)"><g id="boat">
            <path d="M -40 -4 L 40 -4 L 28 12 L -28 12 Z" fill="#ffffff" />
            <circle cx="-10" cy="-14" r="8" fill="#d4a24c" /><circle cx="10" cy="-14" r="8" fill="#d4a24c" />
          </g></g>
          <g font-family="PJS" font-weight="800">
            <text id="l1" x="150" y="150" fill="#fff" font-size="44">Bandla Dhar</text>
            <text id="l1b" x="150" y="192" fill="#d4a24c" font-size="32" font-weight="500">paragliding take-off</text>
            <text id="l2" x="860" y="590" fill="#fff" font-size="44">Luhnu</text>
            <text id="l2b" x="1010" y="590" fill="#d4a24c" font-size="32" font-weight="500">landing · water-sports base</text>
            <text id="l3" x="1700" y="262" fill="#fff" font-size="44" text-anchor="end">Mandi Bharari</text>
            <text id="l3b" x="1700" y="302" fill="#d4a24c" font-size="32" font-weight="500" text-anchor="end">main boating jetty</text>
          </g>
        </svg>
      </div></div>
      <div id="cc" class="clip" data-start="0" data-duration="12" data-track-index="3" style="position:absolute;inset:0">
        <div class="chips">
          <div id="c1" class="chip" style="left:0px;background:#ffffff;color:#0b1f33">28 temples went under</div>
          <div id="c2" class="chip" style="left:560px;background:#ffffff;color:#0b1f33">Life jacket: every rider</div>
          <div id="c3" class="chip" style="left:1130px;background:#d4a24c;color:#0b1f33">Price: Get Quote</div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const months = ["J","F","M","A","M","J","J","A","S","O","N","D"];
      const lv = [0.78, 0.55, 0.42, 0.32, 0.26, 0.3, 0.62, 0.9, 1, 0.97, 0.92, 0.85];
      const kind = ["hi","lo","lo","lo","lo","lo","mid","hi","hi","hi","hi","hi"];
      const bars = document.getElementById("bars"), labs = document.getElementById("labs");
      const W = 132, G = 12, H = 400, B = 470;
      months.forEach((m, i) => {
        const x = i * (W + G);
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", x); r.setAttribute("width", W); r.setAttribute("rx", 10);
        r.setAttribute("fill", kind[i] === "hi" ? "#d4a24c" : kind[i] === "lo" ? "rgba(255,255,255,0.82)" : "rgba(110,170,220,0.9)");
        r.setAttribute("y", B); r.setAttribute("height", 0); r.id = "b" + i;
        bars.appendChild(r);
        const t = document.createElementNS(NS, "text");
        t.setAttribute("x", x + W / 2); t.setAttribute("y", B + 50); t.textContent = m; labs.appendChild(t);
      });
      months.forEach((m, i) => {
        const h = H * lv[i];
        tl.fromTo("#b" + i, { attr: { y: B, height: 0 } }, { attr: { y: B - h, height: h }, duration: 0.6, ease: "power3.out" }, 0.5 + i * 0.12);
      });
      tl.fromTo("#anHi", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.4);
      tl.fromTo("#anLo", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 3.4);
      tl.fromTo(["#kk", "#h1"], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.1, ease: "power3.out" }, 0.1);
      tl.to("#p1i", { opacity: 0, duration: 0.4 }, 6.4);
      tl.to("#h1", { opacity: 0, y: -20, duration: 0.3 }, 6.4);
      tl.fromTo("#h2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 6.7);
      tl.set("#h2", { opacity: 0 }, 0);
      tl.fromTo("#p2i", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 6.5);
      tl.fromTo(["#l1", "#l1b"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.8);
      const route = document.getElementById("route"); const L = route.getTotalLength();
      const trail = document.createElementNS(NS, "path");
      trail.setAttribute("d", route.getAttribute("d")); trail.setAttribute("fill", "none"); trail.setAttribute("stroke", "#d4a24c"); trail.setAttribute("stroke-width", "7"); trail.setAttribute("stroke-linecap", "round");
      trail.style.strokeDasharray = L + " " + L; trail.style.strokeDashoffset = String(L);
      route.parentNode.insertBefore(trail, route.nextSibling);
      const glider = document.getElementById("glider");
      function put(t) { const a = route.getPointAtLength(L * t); glider.setAttribute("transform", "translate(" + a.x.toFixed(2) + "," + (a.y - 30).toFixed(2) + ")"); trail.style.strokeDashoffset = String(L * (1 - t)); }
      put(0);
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: 1, duration: 2.2, ease: "sine.inOut", immediateRender: false, onUpdate: () => put(st.t) }, 7.0);
      tl.fromTo("#m1", { attr: { fill: "#ffffff" } }, { attr: { fill: "#d4a24c" }, duration: 0.25, immediateRender: false }, 9.2);
      tl.fromTo(["#l2", "#l2b"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.1);
      tl.fromTo("#boat", { x: 0 }, { x: 260, duration: 2.4, ease: "sine.inOut" }, 9.3);
      tl.fromTo(["#l3", "#l3b"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.9);
      tl.fromTo("#m2", { attr: { fill: "#ffffff" } }, { attr: { fill: "#d4a24c" }, duration: 0.25, immediateRender: false }, 10.0);
      tl.fromTo(["#c1", "#c2", "#c3"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.25, ease: "power3.out" }, 4.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
