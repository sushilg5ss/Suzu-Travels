<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.08) 38%, rgba(11,31,51,0.8) 54%, rgba(11,31,51,0.94) 100%); }
      .panel { position: absolute; left: 1020px; top: 0; width: 860px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 100px; color: #d4a24c; font-weight: 800; font-size: 34px; letter-spacing: 0.16em; }
      .t1 { position: absolute; left: 0; top: 148px; color: #fff; font-weight: 800; font-size: 108px; line-height: 1.02; letter-spacing: -0.02em; }
      .t2 { position: absolute; left: 0; top: 258px; color: #d4a24c; font-weight: 800; font-size: 100px; line-height: 1.02; letter-spacing: -0.02em; }
      svg.lake { position: absolute; left: 0; top: 400px; width: 840px; height: 440px; overflow: visible; }
      .bar { position: absolute; left: 0; top: 896px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
      .facts { position: absolute; left: 0; top: 922px; width: 860px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 860px; color: #fff; font-weight: 800; font-size: 52px; white-space: nowrap; }
      .tag { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 800; font-size: 34px; letter-spacing: 0.08em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="4.6" data-track-index="0"><img id="im1" src="assets/s1.jpg" alt="" /></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="3.8" data-duration="4.4" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/s2.jpg" alt="" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="7.4" data-duration="4.6" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/s3.jpg" alt="" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="10.8" data-duration="1.2" data-track-index="3"><img id="im5" src="assets/s1.jpg" alt="" /></div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="4" style="position:absolute;inset:0">
        <div class="shade"></div>
        <div class="panel">
          <div class="kicker">WATER · BILASPUR, HIMACHAL</div>
          <div class="t1">Gobind Sagar</div>
          <div class="t2">lake rides</div>
          <svg class="lake" viewBox="0 0 840 440">
            <defs>
              <clipPath id="valley"><path d="M 0 60 Q 120 70 200 160 Q 300 300 420 330 Q 540 300 640 160 Q 720 70 840 60 L 840 -40 L 0 -40 Z" /></clipPath>
            </defs>
            <path id="curve" d="M 0 60 Q 120 70 200 160 Q 300 300 420 330 Q 540 300 640 160 Q 720 70 840 60" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="5" stroke-linecap="round" />
            <g clip-path="url(#valley)">
              <rect id="water" x="0" y="130" width="840" height="320" fill="rgba(11,31,51,0.5)" />
              <g id="temple" fill="#ffffff">
                <rect x="396" y="262" width="48" height="66" />
                <path d="M 390 264 L 420 214 L 450 264 Z" />
                <rect x="417" y="196" width="6" height="20" />
              </g>
              <rect id="water2" x="0" y="130" width="840" height="320" fill="rgba(80,140,200,0.8)" />
            </g>
            <line id="lvl" x1="0" y1="130" x2="840" y2="130" stroke="#d4a24c" stroke-width="6" stroke-linecap="round" />
            <g id="boat">
              <path d="M -38 -4 L 38 -4 L 26 12 L -26 12 Z" fill="#ffffff" />
              <circle cx="-10" cy="-14" r="8" fill="#d4a24c" />
              <circle cx="10" cy="-14" r="8" fill="#d4a24c" />
            </g>
          </svg>
          <div id="tagHi" class="tag" style="left:0px;top:380px;color:#d4a24c">HIGH WATER · AUG–JAN</div>
          <div id="tagLo" class="tag" style="left:0px;top:380px;color:#fff">LOW WATER · TEMPLES SHOW</div>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">Boat rides &amp; jet skis</div>
            <div class="fact" id="f2">Life jacket for every rider</div>
            <div class="fact" id="f3">Old temples rise as it falls</div>
            <div class="fact" id="f4">Best water Aug–Jan</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.08, x: -30, duration: 4.6, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.08, x: 20 }, { scale: 1, x: -20, duration: 4.4, ease: "none" }, 3.8);
      tl.fromTo("#im3", { scale: 1, y: 0 }, { scale: 1.07, y: -20, duration: 4.6, ease: "none" }, 7.4);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 3.8);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 7.4);
      tl.fromTo("#im5", { opacity: 0 }, { opacity: 1, duration: 1.15, ease: "sine.inOut" }, 10.8);

      const water = [document.getElementById("water"), document.getElementById("water2")];
      const lvl = document.getElementById("lvl");
      const boat = document.getElementById("boat");
      const HI = 130, LO = 300;
      const cv = document.getElementById("curve"); const CL = cv.getTotalLength(); const pts = [];
      for (let i = 0; i <= 400; i++) { const q = cv.getPointAtLength(CL * 0.5 * i / 400); pts.push({ x: q.x, y: q.y }); }
      function put(p, bx) {
        const y = HI + (LO - HI) * p;
        water.forEach(w => w.setAttribute("y", y.toFixed(2)));
        // gold level line spans only the water width at this height
        let half = 0;
        for (let i = 0; i < pts.length; i++) { if (pts[i].y >= y) { half = 420 - pts[i].x; break; } }
        lvl.setAttribute("y1", y.toFixed(2)); lvl.setAttribute("y2", y.toFixed(2));
        lvl.setAttribute("x1", (420 - half).toFixed(2)); lvl.setAttribute("x2", (420 + half).toFixed(2));
        const x = 420 + bx * Math.max(0, half - 50);
        boat.setAttribute("opacity", Math.max(0, Math.min(1, 1 - (p - 0.6) / 0.3)).toFixed(3));
        boat.setAttribute("transform", "translate(" + x.toFixed(2) + "," + (y - 8).toFixed(2) + ")");
      }
      const st = { p: 0, b: -1 };
      put(0, -1);
      const upd = () => put(st.p, st.b);
      tl.fromTo(st, { p: 0 }, { p: 1, duration: 4, ease: "sine.inOut", immediateRender: false, onUpdate: upd }, 1.4);
      tl.to(st, { p: 0, duration: 3.6, ease: "sine.inOut", onUpdate: upd }, 7.6);
      tl.fromTo(st, { b: -1 }, { b: 1, duration: 5.8, ease: "sine.inOut", immediateRender: false, onUpdate: upd }, 0.2);
      tl.to(st, { b: -1, duration: 5.8, ease: "sine.inOut", onUpdate: upd }, 6.0);
      tl.set("#tagLo", { opacity: 0 }, 0);
      tl.to("#tagHi", { opacity: 0, duration: 0.4 }, 3.8);
      tl.to("#tagLo", { opacity: 1, duration: 0.4 }, 4.1);
      tl.to("#tagLo", { opacity: 0, duration: 0.4 }, 8.4);
      tl.to("#tagHi", { opacity: 1, duration: 0.4 }, 8.7);

      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 2.6], ["#f2", "#f3", 5.0], ["#f3", "#f4", 8.2], ["#f4", "#f1", 11.0]];
      seq.forEach(([a, b, t]) => {
        tl.to(a, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
