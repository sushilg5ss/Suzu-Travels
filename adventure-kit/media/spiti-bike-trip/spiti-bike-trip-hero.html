<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.1) 36%, rgba(11,31,51,0.8) 54%, rgba(11,31,51,0.93) 100%); }
      .panel { position: absolute; left: 1020px; top: 0; width: 840px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 100px; color: #d4a24c; font-weight: 800; font-size: 32px; letter-spacing: 0.18em; }
      .t1 { position: absolute; left: 0; top: 146px; color: #fff; font-weight: 800; font-size: 124px; line-height: 1.02; letter-spacing: -0.02em; }
      .t2 { position: absolute; left: 0; top: 276px; color: #d4a24c; font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; }
      svg.map { position: absolute; left: 0; top: 420px; width: 840px; height: 300px; overflow: visible; }
      svg.map text { font-family: "PJS", sans-serif; font-weight: 800; font-size: 26px; fill: #fff; }
      .alt { position: absolute; left: 0; top: 748px; color: #fff; font-weight: 800; font-size: 84px; letter-spacing: -0.02em; white-space: nowrap; }
      .altlab { position: absolute; left: 420px; top: 764px; width: 420px; text-align: right; color: rgba(255,255,255,0.9); font-weight: 500; font-size: 30px; line-height: 1.25; }
      .bar { position: absolute; left: 0; top: 874px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
      .facts { position: absolute; left: 0; top: 900px; width: 840px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 840px; color: #fff; font-weight: 800; font-size: 50px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="3.8" data-track-index="0"><img id="im1" src="assets/s1.jpg" alt="" /></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="3" data-duration="3.8" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/s2.jpg" alt="" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="6" data-duration="3.8" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/s3.jpg" alt="" /></div></div>
      <div id="sc4" class="scene clip" data-layout-allow-overflow data-start="9" data-duration="3" data-track-index="3"><div id="fd4" style="position:absolute;inset:0"><img id="im4" src="assets/s4.jpg" alt="" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="10.8" data-duration="1.2" data-track-index="4"><img id="im5" src="assets/s1.jpg" alt="" /></div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="5" style="position:absolute;inset:0">
        <div class="shade"></div>
        <div class="panel">
          <div class="kicker">RIDES · SPITI VALLEY</div>
          <div class="t1">Spiti</div>
          <div class="t2">Bike Trip</div>
          <svg class="map" viewBox="0 0 840 300">
            <path d="M 150 262 L 560 248 L 716 176 L 650 76 L 430 46 L 236 70 L 110 120" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
            <path id="route" d="M 150 262 L 560 248 L 716 176 L 650 76 L 430 46 L 236 70 L 110 120" fill="none" stroke="#d4a24c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
            <g id="pins"></g>
            <circle id="rider" cx="150" cy="262" r="15" fill="#fff" stroke="#d4a24c" stroke-width="6" />
            <text x="150" y="300" text-anchor="middle">Shimla</text>
            <text x="560" y="294" text-anchor="middle">Reckong Peo</text>
            <text x="742" y="186">Nako</text>
            <text x="676" y="70">Kaza</text>
            <text x="430" y="12" text-anchor="middle">Kunzum</text>
            <text x="236" y="40" text-anchor="middle">Atal Tunnel</text>
            <text x="92" y="170" text-anchor="middle">Manali</text>
          </svg>
          <div class="alt" id="altv">0 m</div>
          <div class="altlab">altitude at Kunzum Pass (approx.)</div>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">Kinnaur in · Kunzum out</div>
            <div class="fact" id="f2">Full circuit: mid-Jun – Sep</div>
            <div class="fact" id="f3">We check both roads for you</div>
            <div class="fact" id="f4">Bike + stays + backup cab</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.08, x: -30, duration: 3.8, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.08, x: 20 }, { scale: 1, x: -20, duration: 3.8, ease: "none" }, 3);
      tl.fromTo("#im3", { scale: 1, y: 0 }, { scale: 1.07, y: -20, duration: 3.8, ease: "none" }, 6);
      tl.fromTo("#im4", { scale: 1.07, y: 10 }, { scale: 1, y: -10, duration: 3, ease: "none" }, 9);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 3);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 6);
      tl.fromTo("#fd4", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 9);
      tl.fromTo("#im5", { opacity: 0 }, { opacity: 1, duration: 1.15, ease: "sine.inOut" }, 10.8);

      // route: gold line draws the loop (0.3–7 s), rider dot follows; both fade out 11.1–11.9 so last frame = first frame
      const route = document.getElementById("route");
      const L = route.getTotalLength();
      route.setAttribute("stroke-dasharray", L + " " + L);
      const rider = document.getElementById("rider");
      const st = { d: 0 };
      const place = () => { const p = route.getPointAtLength(st.d * L); rider.setAttribute("cx", p.x.toFixed(2)); rider.setAttribute("cy", p.y.toFixed(2)); route.setAttribute("stroke-dashoffset", (L * (1 - st.d)).toFixed(2)); if (window.showAlt) window.showAlt(); };
      tl.fromTo(st, { d: 0 }, { d: 1, duration: 6.7, ease: "sine.inOut", onUpdate: place }, 0.3);
      place();
      tl.fromTo(["#route", "#rider"], { opacity: 1 }, { opacity: 0, duration: 0.8, ease: "sine.in", immediateRender: false }, 11.1);
      const pts = [[150, 262], [560, 248], [716, 176], [650, 76], [430, 46], [236, 70], [110, 120]];
      const g = document.getElementById("pins");
      const NS = "http://www.w3.org/2000/svg";
      pts.forEach((p) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]); c.setAttribute("r", 9); c.setAttribute("fill", "#0b1f33"); c.setAttribute("stroke", "#d4a24c"); c.setAttribute("stroke-width", 4); g.appendChild(c); });

      // altitude counter rises to Kunzum (~4,550 m), fades out before the loop point
      const alt = document.getElementById("altv");
      const segs = [[150, 262], [560, 248], [716, 176], [650, 76], [430, 46]];
      let dK = 0; for (let i = 1; i < segs.length; i++) dK += Math.hypot(segs[i][0] - segs[i - 1][0], segs[i][1] - segs[i - 1][1]);
      const fK = dK / L;
      const showAlt = window.showAlt = () => { const f = Math.min(1, st.d / fK); const v = 2000 + 2550 * f * f; alt.textContent = (Math.round(v / 10) * 10).toLocaleString("en-IN") + " m"; };
      tl.fromTo("#altv", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.2);
      showAlt();
      tl.to("#altv", { opacity: 0, duration: 0.6, ease: "sine.in" }, 11.3);

      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 2.6], ["#f2", "#f3", 5.4], ["#f3", "#f4", 8.2], ["#f4", "#f1", 11.0]];
      seq.forEach(([x, y, t]) => {
        tl.to(x, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(y, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
