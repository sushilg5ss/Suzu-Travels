<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.12) 38%, rgba(11,31,51,0.8) 56%, rgba(11,31,51,0.93) 100%); }
      #mist, #snow { position: absolute; inset: 0; }
      .ms { position: absolute; left: 0; top: 0; width: 900px; height: 260px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(235,240,245,0.32) 0%, rgba(235,240,245,0.14) 45%, rgba(235,240,245,0) 70%); }
      .fl { position: absolute; left: 0; top: 0; border-radius: 50%; background: #fff; }
      .panel { position: absolute; left: 1040px; top: 0; width: 820px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 96px; line-height: 1.1; color: #d4a24c; font-weight: 800; font-size: 32px; letter-spacing: 0.16em; }
      .t1 { position: absolute; left: 0; top: 160px; color: #fff; font-weight: 800; font-size: 112px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      .t2 { position: absolute; left: 0; top: 280px; color: #d4a24c; font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      .t3 { position: absolute; left: 0; top: 400px; color: #fff; font-weight: 500; font-size: 46px; white-space: nowrap; }
      svg.prof { position: absolute; left: 0; top: 476px; width: 820px; height: 240px; overflow: visible; }
      svg.prof text { font-family: "PJS", sans-serif; font-weight: 800; font-size: 26px; fill: #fff; }
      .big { position: absolute; left: 0; top: 724px; color: #fff; font-weight: 800; font-size: 80px; letter-spacing: -0.02em; white-space: nowrap; }
      .biglab { position: absolute; left: 400px; top: 742px; width: 420px; white-space: nowrap; text-align: right; color: rgba(255,255,255,0.92); font-weight: 800; font-size: 32px; line-height: 1.15; }
      .bar { position: absolute; left: 0; top: 866px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
      .facts { position: absolute; left: 0; top: 890px; width: 820px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 820px; color: #fff; font-weight: 800; font-size: 50px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="3.8" data-track-index="0"><div style="position:absolute;inset:0"><img id="im1" src="assets/forest.jpg" alt="" style="object-position:30% 60%" /></div></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="3" data-duration="3.8" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/camp.jpg" alt="" style="object-position:30% 60%" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="6" data-duration="3.8" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/snow.jpg" alt="" style="object-position:20% 50%" /></div></div>
      <div id="sc4" class="scene clip" data-layout-allow-overflow data-start="9" data-duration="3" data-track-index="3"><div id="fd4" style="position:absolute;inset:0"><img id="im4" src="assets/ridge.jpg" alt="" style="object-position:30% 50%" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="10.8" data-duration="1.2" data-track-index="4"><div id="fd5" style="position:absolute;inset:0"><img id="im5" src="assets/forest.jpg" alt="" style="object-position:30% 60%" /></div></div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="5" style="position:absolute;inset:0">
        <div id="mist" data-layout-allow-overflow></div>
        <div class="shade"></div>
        <div id="snow"></div>
        <div class="panel">
          <div class="kicker">TREKS &amp; CAMPS · HIMACHAL</div>
          <div class="t1">Trekking in</div>
          <div class="t2">Himachal</div>
          <div class="t3">forest day walks to 5,000 m passes</div>
          <svg class="prof" viewBox="0 0 820 240">
            <path d="M 70 40 L 170 140 L 330 185 L 430 70 L 540 135 L 740 70 M 540 135 L 600 215" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
            <path id="ln" d="M 70 40 L 170 140 L 330 185 L 430 70 L 540 135 L 740 70" fill="none" stroke="#d4a24c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            <path id="ln2" d="M 540 135 L 600 215" fill="none" stroke="#d4a24c" stroke-width="6" stroke-linecap="round" />
            <g id="dots"></g>
            <text x="70" y="14" text-anchor="middle">Chamba</text>
            <text x="150" y="186" text-anchor="middle">Kangra</text>
            <text x="300" y="232" text-anchor="middle">Mandi</text>
            <text x="430" y="34" text-anchor="middle">Kullu</text>
            <text x="560" y="104" text-anchor="middle">Parvati</text>
            <text x="690" y="228" text-anchor="middle">Shimla</text>
            <text x="730" y="34" text-anchor="middle">Kinnaur · Spiti</text>
          </svg>
          <div class="big" id="alt">0 treks</div>
          <div class="biglab">on Suzu, from day walks<br />to multi-day passes</div>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">Forest day walks from ~2,000 m</div>
            <div class="fact" id="f2">Meadow camps on 2–5 day treks</div>
            <div class="fact" id="f3">High passes up to 5,319 m</div>
            <div class="fact" id="f4">Best Mar–Jun &amp; Sep–Nov</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const D = 12;
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.08, x: -30, duration: 3.8, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.08, x: 20 }, { scale: 1, x: -20, duration: 3.8, ease: "none" }, 3);
      tl.fromTo("#im3", { scale: 1, y: 0 }, { scale: 1.06, y: -20, duration: 3.8, ease: "none" }, 6);
      tl.fromTo("#im4", { scale: 1.07, y: 10 }, { scale: 1, y: -10, duration: 3, ease: "none" }, 9);
      tl.fromTo("#im5", { scale: 1, x: 0 }, { scale: 1, x: 0, duration: 1.2, ease: "none" }, 10.8);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 3);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 6);
      tl.fromTo("#fd4", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 9);
      tl.fromTo("#fd5", { opacity: 0 }, { opacity: 1, duration: 1.15, ease: "sine.inOut" }, 10.8);
      const ln = document.getElementById("ln"), ln2 = document.getElementById("ln2");
      const L1 = ln.getTotalLength(), L2 = ln2.getTotalLength();
      ln.setAttribute("stroke-dasharray", L1 + " " + L1); ln2.setAttribute("stroke-dasharray", L2 + " " + L2);
      tl.fromTo(ln, { attr: { "stroke-dashoffset": L1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 8, ease: "none" }, 0.6);
      tl.fromTo(ln2, { attr: { "stroke-dashoffset": L2 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: "none" }, 6.4);
      tl.to([ln, ln2], { opacity: 0, duration: 0.5, ease: "power1.in" }, 11.1);
      const NS = "http://www.w3.org/2000/svg";
      const g = document.getElementById("dots");
      const stops = [[70, 40, 0.6], [170, 140, 1.7], [330, 185, 3.1], [430, 70, 4.4], [540, 135, 5.6], [600, 215, 7.6], [740, 70, 8.6]];
      const nodes = stops.map((p) => {
        const h = document.createElementNS(NS, "circle");
        h.setAttribute("cx", p[0]); h.setAttribute("cy", p[1]); h.setAttribute("r", 0); h.setAttribute("fill", "rgba(212,162,76,0.4)");
        const d = document.createElementNS(NS, "circle");
        d.setAttribute("cx", p[0]); d.setAttribute("cy", p[1]); d.setAttribute("r", 11); d.setAttribute("fill", "rgba(255,255,255,0.55)"); d.setAttribute("stroke", "#fff"); d.setAttribute("stroke-width", 3);
        g.appendChild(h); g.appendChild(d); return { h, d, t: p[2] };
      });
      const altEl = document.getElementById("alt");
      const st = { t: 0 };
      const upd = () => {
        const t = st.t;
        let k = (t - 0.6) / 8.4; k = Math.max(0, Math.min(1, k)); const e = k * k * (3 - 2 * k);
        let v = Math.round(e * 25);
        altEl.textContent = (t >= 9.0 && t < 11.55) ? "25+ treks" : (t >= 11.55 ? "0 treks" : v + (v === 1 ? " trek" : " treks"));
        const s = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 / 1.5);
        nodes.forEach((n) => {
          const lit = t >= n.t && t < 11.3;
          n.d.setAttribute("fill", lit ? "#d4a24c" : "rgba(255,255,255,0.55)");
          const age = t - n.t;
          const pulse = lit && age < 1.2 ? (1 - age / 1.2) : 0;
          n.h.setAttribute("r", (pulse * 34).toFixed(2)); n.h.setAttribute("opacity", pulse.toFixed(3));
        });
      };
      tl.fromTo(st, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: upd }, 0);
      tl.to("#alt", { opacity: 0, duration: 0.3, ease: "power1.in" }, 11.2);
      tl.fromTo("#alt", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out", immediateRender: false }, 11.55);
      let seed = 53;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      const mist = document.getElementById("mist");
      const blobs = [];
      for (let i = 0; i < 7; i++) {
        const el = document.createElement("div"); el.className = "ms"; mist.appendChild(el);
        blobs.push({ el, x: rnd() * 2800, y: 380 + rnd() * 600, c: 1, sc: 0.8 + rnd() * 0.8 });
      }
      let seed2 = 41;
      const rnd2 = () => { seed2 = (seed2 * 16807) % 2147483647; return (seed2 - 1) / 2147483646; };
      const snow = document.getElementById("snow");
      const flakes = [];
      for (let i = 0; i < 70; i++) {
        const el = document.createElement("div"); el.className = "fl";
        const s = 3 + rnd2() * 6; el.style.width = s + "px"; el.style.height = s + "px"; el.style.opacity = (0.45 + rnd2() * 0.5).toFixed(2);
        snow.appendChild(el);
        flakes.push({ el, x: rnd2() * 1920, y: rnd2() * 1140, c: 1 + Math.floor(rnd2() * 2), w: 1 + Math.floor(rnd2() * 3), a: 10 + rnd2() * 30, ph: rnd2() * 6.283 });
      }
      const fx = { t: 0 };
      const fxUpd = () => {
        const p = fx.t / D;
        blobs.forEach((b) => {
          const x = ((b.x + p * b.c * 2800) % 2800) - 900;
          b.el.style.transform = `translate(${x.toFixed(1)}px, ${b.y.toFixed(1)}px) scale(${b.sc.toFixed(2)})`;
        });
        flakes.forEach((f) => {
          const y = ((f.y + p * f.c * 1140) % 1140) - 40;
          const x = f.x + Math.sin(p * f.w * 6.283 + f.ph) * f.a;
          f.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
        });
      };
      tl.fromTo(fx, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: fxUpd }, 0);
      tl.set("#snow", { opacity: 0 }, 0);
      tl.to("#snow", { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 5.9);
      tl.to("#snow", { opacity: 0, duration: 0.7, ease: "sine.inOut" }, 9.2);
      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 2.6], ["#f2", "#f3", 5.4], ["#f3", "#f4", 8.2], ["#f4", "#f1", 11.0]];
      seq.forEach(([a, b, t]) => {
        tl.to(a, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
      upd(); fxUpd();
    </script>
  </body>
</html>
