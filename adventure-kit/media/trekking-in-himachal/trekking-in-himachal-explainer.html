<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; background: radial-gradient(ellipse at 70% 20%, #16365a 0%, #0b1f33 65%); color: #fff; }
      .kicker { position: absolute; left: 110px; top: 64px; color: #d4a24c; font-weight: 800; font-size: 30px; letter-spacing: 0.16em; line-height: 1.1; }
      .title { position: absolute; left: 110px; top: 108px; font-weight: 800; font-size: 76px; letter-spacing: -0.02em; line-height: 1.1; white-space: nowrap; }
      .nts { position: absolute; left: 110px; top: 204px; font-weight: 500; font-size: 26px; color: rgba(255,255,255,0.65); white-space: nowrap; }
      svg.ch { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
      svg.ch text { font-family: "PJS", sans-serif; font-weight: 800; fill: #fff; }
      #strip { position: absolute; left: 110px; top: 830px; width: 1700px; }
      .mh { display: flex; margin-left: 300px; gap: 8px; height: 30px; }
      .mh span { width: 110px; text-align: center; font-weight: 800; font-size: 24px; color: rgba(255,255,255,0.7); }
      .row { display: flex; align-items: center; gap: 8px; height: 50px; }
      .row b { width: 292px; font-weight: 800; font-size: 30px; white-space: nowrap; }
      .row i { display: inline-block; width: 110px; height: 38px; border-radius: 8px; }
      .legend { position: absolute; left: 410px; top: 1024px; display: flex; gap: 36px; font-weight: 800; font-size: 24px; white-space: nowrap; }
      .legend span { display: flex; align-items: center; gap: 10px; }
      .legend i { width: 24px; height: 24px; border-radius: 6px; display: inline-block; }
      .tag { position: absolute; right: 110px; top: 116px; padding: 16px 28px; border-radius: 40px; border: 3px solid #d4a24c; color: #fff; font-weight: 800; font-size: 30px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="main" class="clip" data-start="0" data-duration="12" data-track-index="0" style="position:absolute;inset:0">
        <div class="kicker">TREKKING IN HIMACHAL · HOW HIGH, WHEN?</div>
        <div class="title">Forest walks to 5,319 m passes</div>
        <div class="nts">Approximate top heights from Suzu trek pages · bars to scale</div>
        <div class="tag" id="tag">Price: Get Quote</div>
        <svg class="ch" viewBox="0 0 1920 1080">
          <line x1="110" y1="700" x2="1810" y2="700" stroke="rgba(255,255,255,0.35)" stroke-width="3" />
          <g id="b0"><rect class="bar" x="150" y="521" width="180" height="179" rx="14" fill="#9fc3a0" /><text class="val" x="240.0" y="499" text-anchor="middle" font-size="40">~2,300 m</text><text x="240.0" y="750" text-anchor="middle" font-size="32">Jogini Waterfall</text><text x="240.0" y="788" text-anchor="middle" font-size="22" style="fill:rgba(255,255,255,0.65);letter-spacing:0.12em">LOW</text></g><g id="b1"><rect class="bar" x="435" y="478" width="180" height="222" rx="14" fill="#9fc3a0" /><text class="val" x="525.0" y="456" text-anchor="middle" font-size="40">~2,850 m</text><text x="525.0" y="750" text-anchor="middle" font-size="32">Triund</text><text x="525.0" y="788" text-anchor="middle" font-size="22" style="fill:rgba(255,255,255,0.65);letter-spacing:0.12em">LOW</text></g><g id="b2"><rect class="bar" x="720" y="471" width="180" height="229" rx="14" fill="#9fc3a0" /><text class="val" x="810.0" y="449" text-anchor="middle" font-size="40">2,934 m</text><text x="810.0" y="750" text-anchor="middle" font-size="32">Kareri Lake</text><text x="810.0" y="788" text-anchor="middle" font-size="22" style="fill:rgba(255,255,255,0.65);letter-spacing:0.12em">LOW</text></g><g id="b3"><rect class="bar" x="1005" y="415" width="180" height="285" rx="14" fill="#e8eef4" /><text class="val" x="1095.0" y="393" text-anchor="middle" font-size="40">3,660 m</text><text x="1095.0" y="750" text-anchor="middle" font-size="32">Chandrakhani</text><text x="1095.0" y="788" text-anchor="middle" font-size="22" style="fill:rgba(255,255,255,0.65);letter-spacing:0.12em">MID</text></g><g id="b4"><rect class="bar" x="1290" y="367" width="180" height="333" rx="14" fill="#d4a24c" /><text class="val" x="1380.0" y="345" text-anchor="middle" font-size="40">~4,270 m</text><text x="1380.0" y="750" text-anchor="middle" font-size="32">Hampta Pass</text><text x="1380.0" y="788" text-anchor="middle" font-size="22" style="fill:rgba(255,255,255,0.65);letter-spacing:0.12em">HIGH PASS</text></g><g id="b5"><rect class="bar" x="1575" y="285" width="180" height="415" rx="14" fill="#d4a24c" /><text class="val" x="1665.0" y="263" text-anchor="middle" font-size="40">5,319 m</text><text x="1665.0" y="750" text-anchor="middle" font-size="32">Pin Parvati</text><text x="1665.0" y="788" text-anchor="middle" font-size="22" style="fill:rgba(255,255,255,0.65);letter-spacing:0.12em">HIGH PASS</text></g>
        </svg>
        <div id="strip"><div class="mh"><span>J</span><span>F</span><span>M</span><span>A</span><span>M</span><span>J</span><span>J</span><span>A</span><span>S</span><span>O</span><span>N</span><span>D</span></div><div class="row" id="r0"><b>Low treks</b><i style="background:#ffffff"></i><i style="background:#ffffff"></i><i style="background:#d4a24c"></i><i style="background:#d4a24c"></i><i style="background:#d4a24c"></i><i style="background:#d4a24c"></i><i style="background:rgba(255,255,255,0.28)"></i><i style="background:rgba(255,255,255,0.28)"></i><i style="background:#d4a24c"></i><i style="background:#d4a24c"></i><i style="background:#d4a24c"></i><i style="background:#ffffff"></i></div><div class="row" id="r1"><b>Mid treks</b><i style="background:rgba(255,255,255,0.07)"></i><i style="background:rgba(255,255,255,0.07)"></i><i style="background:rgba(255,255,255,0.55)"></i><i style="background:rgba(255,255,255,0.55)"></i><i style="background:#d4a24c"></i><i style="background:#d4a24c"></i><i style="background:rgba(255,255,255,0.28)"></i><i style="background:rgba(255,255,255,0.28)"></i><i style="background:#d4a24c"></i><i style="background:#d4a24c"></i><i style="background:rgba(255,255,255,0.07)"></i><i style="background:rgba(255,255,255,0.07)"></i></div><div class="row" id="r2"><b>High passes</b><i style="background:rgba(255,255,255,0.07)"></i><i style="background:rgba(255,255,255,0.07)"></i><i style="background:rgba(255,255,255,0.07)"></i><i style="background:rgba(255,255,255,0.07)"></i><i style="background:rgba(255,255,255,0.07)"></i><i style="background:#d4a24c"></i><i style="background:#d4a24c"></i><i style="background:#d4a24c"></i><i style="background:#d4a24c"></i><i style="background:rgba(255,255,255,0.07)"></i><i style="background:rgba(255,255,255,0.07)"></i><i style="background:rgba(255,255,255,0.07)"></i></div></div>
        <div class="legend" id="lg"><span><i style="background:#d4a24c"></i>Best</span><span><i style="background:#fff"></i>Snow (low treks)</span><span><i style="background:rgba(255,255,255,0.55)"></i>Snow on top camps</span><span><i style="background:rgba(255,255,255,0.28)"></i>Monsoon, slippery</span><span><i style="background:rgba(255,255,255,0.07);outline:2px solid rgba(255,255,255,0.3)"></i>Closed</span></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      for (let i = 0; i < 6; i++) {
        const t = 0.5 + i * 0.75;
        const bar = document.querySelector("#b" + i + " .bar"); const H = +bar.getAttribute("height");
        tl.fromTo(bar, { attr: { y: 700, height: 0 } }, { attr: { y: 700 - H, height: H }, duration: 0.7, ease: "power3.out" }, t);
        tl.fromTo("#b" + i + " text", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", stagger: 0.05 }, t + 0.3);
      }
      tl.fromTo(".mh", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.6);
      ["#r0", "#r1", "#r2"].forEach((r, i) => {
        tl.fromTo(r + " b", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 5.8 + i * 0.7);
        tl.fromTo(r + " i", { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out", stagger: 0.04 }, 5.9 + i * 0.7);
      });
      tl.fromTo("#lg", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 8.2);
      tl.fromTo("#tag", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 9.0);
      tl.to("#main", { opacity: 1, duration: 3 }, 9.0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
