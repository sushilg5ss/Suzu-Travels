<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; background: radial-gradient(ellipse at 70% 20%, #16365a 0%, #0b1f33 65%); color: #fff; }
      .kicker { position: absolute; left: 110px; top: 80px; color: #d4a24c; font-weight: 800; font-size: 30px; letter-spacing: 0.16em; }
      .title { position: absolute; left: 110px; top: 126px; font-weight: 800; font-size: 84px; letter-spacing: -0.02em; }
      svg.map { position: absolute; left: 70px; top: 270px; width: 1150px; height: 650px; overflow: visible; }
      svg.map text { font-family: "PJS", sans-serif; font-weight: 800; fill: #fff; }
      .side { position: absolute; left: 1400px; top: 300px; width: 440px; }
      .lab { color: rgba(255,255,255,0.75); font-weight: 800; font-size: 28px; letter-spacing: 0.08em; }
      .num { font-weight: 800; font-size: 96px; letter-spacing: -0.02em; margin: 6px 0 30px; white-space: nowrap; }
      .altbar { position: relative; width: 440px; height: 26px; border-radius: 13px; background: rgba(255,255,255,0.15); margin: 14px 0 40px; overflow: hidden; }
      .altfill { position: absolute; left: 0; top: 0; height: 26px; width: 0; border-radius: 13px; background: #d4a24c; }
      .tog { display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: 34px; }
      .pill { width: 96px; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.2); position: relative; }
      .knob { position: absolute; left: 6px; top: 6px; width: 40px; height: 40px; border-radius: 50%; background: #fff; }
      .end { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #0b1f33; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; opacity: 0; }
      .end .row { display: flex; gap: 40px; }
      .card { width: 640px; padding: 44px 40px; border-radius: 28px; background: #fff; color: #0b1f33; text-align: center; }
      .card b { display: block; font-size: 64px; font-weight: 800; }
      .card span { display: block; font-size: 34px; white-space: nowrap; font-weight: 500; margin-top: 8px; }
      .card.g { background: #d4a24c; }
      .endnote { font-size: 38px; font-weight: 500; color: rgba(255,255,255,0.9); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="main" class="clip" data-start="0" data-duration="12" data-track-index="0" style="position:absolute;inset:0">
        <div class="kicker">DOME STAY IN MANALI</div>
        <div class="title">Your road to a dome</div>
        <svg class="map" viewBox="0 0 1240 700">
          <path id="route" d="M 60 620 L 360 560 L 420 470 L 560 500 L 600 400 L 760 430 L 800 330 L 960 350 L 1010 250 L 1150 150" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" />
          <path id="gold" d="M 60 620 L 360 560 L 420 470 L 560 500 L 600 400 L 760 430 L 800 330 L 960 350 L 1010 250 L 1150 150" fill="none" stroke="#d4a24c" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />
          <circle cx="60" cy="620" r="16" fill="#d4a24c" stroke="#fff" stroke-width="5" />
          <text x="60" y="680" font-size="34" text-anchor="middle">Mall Road</text>
          <g id="bar">
            <rect x="330" y="590" width="64" height="12" rx="4" fill="#fff" />
            <rect x="338" y="590" width="10" height="12" fill="#c0392b" /><rect x="358" y="590" width="10" height="12" fill="#c0392b" /><rect x="378" y="590" width="10" height="12" fill="#c0392b" />
            <rect x="384" y="508" width="56" height="56" rx="8" fill="#fff" />
            <rect x="392" y="516" width="16" height="16" fill="#0b1f33" /><rect x="416" y="516" width="16" height="16" fill="#0b1f33" /><rect x="392" y="540" width="16" height="16" fill="#0b1f33" /><rect x="420" y="544" width="8" height="8" fill="#0b1f33" />
            <text x="300" y="650" font-size="30" text-anchor="middle">Prini barrier</text>
            <text x="300" y="686" font-size="24" text-anchor="middle" fill="#d4a24c" style="fill:#d4a24c">permit QR scanned</text>
          </g>
          <text id="sw" x="660" y="560" font-size="28" text-anchor="middle" style="fill:rgba(255,255,255,0.8)">Hamta road switchbacks</text>
          <g id="domes">
            <path d="M 1090 150 A 46 46 0 0 1 1182 150 Z" fill="#fff" />
            <path d="M 1150 120 A 32 32 0 0 1 1214 120 Z" fill="rgba(255,255,255,0.8)" />
            <circle cx="1136" cy="134" r="9" fill="#ffc46e" />
            <text x="1140" y="210" font-size="34" text-anchor="middle">Dome stays</text>
          </g>
          <g id="car" transform="translate(60,620)">
            <g id="carA"><rect x="-34" y="-30" width="68" height="26" rx="10" fill="#fff" /><rect x="-22" y="-46" width="40" height="20" rx="6" fill="#fff" /><circle cx="-20" cy="-2" r="9" fill="#d4a24c" /><circle cx="20" cy="-2" r="9" fill="#d4a24c" /></g>
            <g id="carB" opacity="0"><rect x="-40" y="-40" width="80" height="34" rx="8" fill="#d4a24c" /><rect x="-30" y="-60" width="56" height="24" rx="5" fill="#d4a24c" /><rect x="-36" y="-66" width="64" height="6" rx="3" fill="#fff" /><circle cx="-24" cy="-2" r="12" fill="#fff" /><circle cx="24" cy="-2" r="12" fill="#fff" /><text x="0" y="-16" font-size="20" text-anchor="middle" style="fill:#0b1f33">4x4</text></g>
          </g>
        </svg>
        <div class="side">
          <div class="lab">FROM MALL ROAD</div>
          <div class="num" id="km">0 km</div>
          <div class="lab">ALTITUDE</div>
          <div class="num" id="alt" style="margin-bottom:0">~2,050 m</div>
          <div class="altbar"><div class="altfill" id="af"></div></div>
          <div class="tog"><span>Fresh snow?</span><div class="pill" id="pill"><div class="knob" id="knob"></div></div></div>
          <div class="lab" id="note" style="margin-top:22px;opacity:0;color:#d4a24c">4x4 ONLY ON THE HAMTA ROAD</div>
        </div>
      </div>
      <div class="end clip" id="end" data-start="9" data-duration="3" data-track-index="1">
        <div class="row">
          <div class="card g"><b>Dome</b><span>all year · heated</span></div>
          <div class="card"><b>Igloo</b><span>Dec–Feb · when snow allows</span></div>
        </div>
        <div class="endnote">Hotel + cab + snow day in one quote · Price: Get Quote</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const gold = document.getElementById("gold");
      const L = gold.getTotalLength();
      gold.style.strokeDasharray = L; gold.style.strokeDashoffset = L;
      const st = { p: 0 };
      const car = document.getElementById("car");
      const kmEl = document.getElementById("km"), altEl = document.getElementById("alt"), af = document.getElementById("af");
      const upd = () => {
        const p = st.p;
        gold.style.strokeDashoffset = (L * (1 - p)).toFixed(1);
        const pt = gold.getPointAtLength(L * p);
        car.setAttribute("transform", `translate(${pt.x.toFixed(1)},${pt.y.toFixed(1)})`);
        kmEl.textContent = p < 0.98 ? Math.round(p * 13) + " km" : "12–15 km";
        altEl.textContent = "~" + (Math.round((2050 + 600 * p) / 10) * 10).toLocaleString("en-US") + " m";
        af.style.width = (440 * (0.25 + 0.75 * p)).toFixed(1) + "px";
      };
      tl.fromTo(st, { p: 0 }, { p: 1, duration: 7, ease: "power1.inOut", onUpdate: upd }, 0.8);
      tl.fromTo("#bar", { opacity: 0.35 }, { opacity: 1, duration: 0.4 }, 1.6);
      tl.fromTo("#domes", { opacity: 0.4, scale: 0.9, transformOrigin: "1140px 150px" }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, 7.4);
      tl.to("#knob", { x: 44, duration: 0.35, ease: "power2.inOut" }, 4.2);
      tl.to("#pill", { backgroundColor: "#d4a24c", duration: 0.35 }, 4.2);
      tl.to("#carA", { opacity: 0, duration: 0.3 }, 4.3);
      tl.to("#carB", { opacity: 1, duration: 0.3 }, 4.3);
      tl.to("#note", { opacity: 1, duration: 0.4 }, 4.5);
      tl.to("#main", { opacity: 0, duration: 0.5 }, 9);
      tl.to("#end", { opacity: 1, duration: 0.5, ease: "power1.out" }, 9);
      tl.from(".end .card", { y: 40, opacity: 0, duration: 0.5, stagger: 0.15, ease: "power2.out" }, 9.2);
      window.__timelines["main"] = tl;
      tl.seek(0); upd();
    </script>
  </body>
</html>
