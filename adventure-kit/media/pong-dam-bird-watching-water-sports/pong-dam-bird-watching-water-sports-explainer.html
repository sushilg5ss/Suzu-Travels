<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; background: #0b1f33; }
      .kick { position: absolute; left: 96px; top: 70px; color: #d4a24c; font-weight: 800; font-size: 34px; letter-spacing: 0.16em; white-space: nowrap; }
      .h { position: absolute; left: 96px; top: 118px; width: 1700px; color: #fff; font-weight: 800; font-size: 76px; letter-spacing: -0.02em; white-space: nowrap; }
      .pane { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      svg.g { position: absolute; left: 96px; top: 260px; width: 1728px; height: 620px; overflow: visible; }
      .chips { position: absolute; left: 96px; top: 940px; width: 1728px; height: 90px; }
      .chip { position: absolute; top: 0; height: 76px; line-height: 76px; padding: 0 32px; border-radius: 38px; font-weight: 800; font-size: 36px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="ttl" class="clip" data-start="0" data-duration="12" data-track-index="0" style="position:absolute;inset:0">
        <div class="kick">PONG DAM LAKE · KANGRA</div>
        <div id="h1" class="h">One lake, three seasons</div>
        <div id="h2" class="h">Birds or boats: pick your shore</div>
      </div>
      <div id="p1" class="clip" data-start="0" data-duration="6.8" data-track-index="1" style="position:absolute;inset:0"><div id="p1i" class="pane">
        <svg class="g" viewBox="0 0 1728 620">
          <g id="mon" font-family="PJS" font-weight="800" font-size="34" fill="rgba(255,255,255,0.85)" text-anchor="middle"></g>
          <line x1="0" y1="560" x2="1728" y2="560" stroke="rgba(255,255,255,0.3)" stroke-width="3" />
          <g id="b1">
            <rect id="b1a" x="4" y="40" width="280" height="110" rx="20" fill="#d4a24c" />
            <rect id="b1b" x="1444" y="40" width="280" height="110" rx="20" fill="#d4a24c" />
            <text x="300" y="113" fill="#d4a24c" font-family="PJS" font-weight="800" font-size="44">MIGRATORY BIRDS · NOV–FEB</text>
          </g>
          <g id="b2">
            <rect x="292" y="200" width="568" height="110" rx="20" fill="#ffffff" />
            <text x="880" y="273" fill="#ffffff" font-family="PJS" font-weight="800" font-size="44">TEMPLES SHOW · MAR–JUN</text>
          </g>
          <g id="b3">
            <rect x="936" y="360" width="288" height="110" rx="20" fill="#c8503c" />
            <text x="1204" y="433" fill="#ffffff" font-family="PJS" font-weight="800" font-size="40" text-anchor="end" transform="translate(-300,0)">NO WATER SPORTS · 15 JUL–15 SEP</text>
          </g>
        </svg>
      </div></div>
      <div id="p2" class="clip" data-start="6.4" data-duration="5.6" data-track-index="2" style="position:absolute;inset:0"><div id="p2i" class="pane">
        <svg class="g" viewBox="0 0 1728 620">
          <path d="M 120 380 C 260 300 420 330 560 290 C 700 250 820 300 940 330 C 1040 355 1080 420 980 460 C 860 505 700 470 560 500 C 400 535 230 520 140 470 C 90 440 90 400 120 380 Z" fill="rgba(110,170,220,0.55)" />
          <path d="M 260 420 Q 380 405 500 420 M 640 400 Q 760 388 880 400" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="4" stroke-linecap="round" />
          <text x="560" y="455" fill="rgba(255,255,255,0.9)" font-family="PJS" font-weight="800" font-size="34" text-anchor="middle">PONG DAM LAKE</text>
          <path id="r1" d="M 1560 90 C 1300 120 900 150 600 250 C 520 275 440 285 380 300" fill="none" stroke="#d4a24c" stroke-width="7" stroke-linecap="round" />
          <path id="r2" d="M 1560 90 C 1460 220 1240 360 1010 420" fill="none" stroke="#d4a24c" stroke-width="7" stroke-linecap="round" />
          <circle cx="1560" cy="90" r="18" fill="#d4a24c" stroke="#0b1f33" stroke-width="5" />
          <text x="1560" y="40" fill="#ffffff" font-family="PJS" font-weight="800" font-size="38" text-anchor="middle">DHARAMSHALA</text>
          <g id="m1">
            <circle cx="380" cy="300" r="16" fill="#ffffff" stroke="#0b1f33" stroke-width="5" />
            <text x="380" y="256" fill="#ffffff" font-family="PJS" font-weight="800" font-size="36" text-anchor="middle">NAGROTA SURIAN</text>
            <text x="380" y="206" fill="#d4a24c" font-family="PJS" font-weight="800" font-size="30" text-anchor="middle">BIRD-WATCHING</text>
          </g>
          <g id="m2">
            <circle cx="1010" cy="420" r="16" fill="#ffffff" stroke="#0b1f33" stroke-width="5" />
            <text x="1046" y="470" fill="#ffffff" font-family="PJS" font-weight="800" font-size="36">KHATIYAR</text>
            <text x="1046" y="508" fill="#d4a24c" font-family="PJS" font-weight="800" font-size="30">WATER-SPORTS CENTRE</text>
          </g>
          <text x="1728" y="600" fill="rgba(255,255,255,0.55)" font-family="PJS" font-weight="500" font-size="26" text-anchor="end">Schematic, not to scale</text>
        </svg>
      </div></div>
      <div id="ch" class="clip" data-start="0" data-duration="12" data-track-index="3" style="position:absolute;inset:0">
        <div class="chips">
          <div id="c1" class="chip" style="left:0;background:#d4a24c;color:#0b1f33">~1.5–2 h from Dharamshala</div>
          <div id="c2" class="chip" style="left:600px;background:#fff;color:#0b1f33">Life jacket on the water</div>
          <div id="c3" class="chip" style="left:1140px;background:transparent;color:#fff;border:3px solid #d4a24c">Price: Get Quote</div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const mon = document.getElementById("mon");
      "JFMAMJJASOND".split("").forEach((m, i) => { const t = document.createElementNS("http://www.w3.org/2000/svg", "text"); t.setAttribute("x", (72 + i * 144).toString()); t.setAttribute("y", "610"); t.textContent = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"][i]; mon.appendChild(t); });
      tl.fromTo("#h1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo("#mon", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.3);
      tl.fromTo("#b1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.8);
      tl.fromTo("#b2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 2.0);
      tl.fromTo("#b3", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.2);
      tl.to("#h1", { opacity: 0, y: -20, duration: 0.4 }, 6.2);
      tl.to("#p1i", { opacity: 0, duration: 0.5 }, 6.3);
      tl.fromTo("#h2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, 6.6);
      tl.set("#h2", { opacity: 0 }, 0);
      tl.fromTo("#p2i", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 6.4);
      ["#r1", "#r2"].forEach((id, k) => { const p = document.querySelector(id); const L = p.getTotalLength(); p.setAttribute("stroke-dasharray", L + " " + L); tl.fromTo(p, { attr: { "stroke-dashoffset": L } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.4, ease: "power1.inOut", immediateRender: false }, 7.0 + k * 0.5); tl.set(p, { attr: { "stroke-dashoffset": L } }, 0); });
      tl.fromTo("#m1", { opacity: 0, scale: 0.6, transformOrigin: "380px 300px" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, 8.4);
      tl.fromTo("#m2", { opacity: 0, scale: 0.6, transformOrigin: "1010px 420px" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, 8.9);
      tl.set(["#m1", "#m2"], { opacity: 0 }, 0);
      tl.fromTo("#c1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, immediateRender: false }, 9.4);
      tl.fromTo("#c2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, immediateRender: false }, 9.8);
      tl.fromTo("#c3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, immediateRender: false }, 10.2);
      tl.set(["#c1", "#c2", "#c3"], { opacity: 0 }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
