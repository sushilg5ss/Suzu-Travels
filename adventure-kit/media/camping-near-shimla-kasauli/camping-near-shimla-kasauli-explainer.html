<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1600, height=900" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
@font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { margin:0; overflow:hidden; background:#0b1f33; }
#root { position:relative; width:100%; height:100%; overflow:hidden; font-family:"PJS",sans-serif; color:#fff; background:#0b1f33; }
.kick { position:absolute; left:80px; top:56px; color:#d4a24c; font-weight:800; font-size:26px; letter-spacing:0.18em; }
.h { position:absolute; left:80px; top:96px; font-weight:800; font-size:58px; letter-spacing:-0.02em; }
.card { position:absolute; right:80px; top:660px; width:560px; height:130px; }
.c { position:absolute; right:0; top:0; width:560px; text-align:right; }
.c b { display:block; font-weight:800; font-size:52px; line-height:1.05; color:#fff; }
.c span { display:block; margin-top:10px; font-weight:500; font-size:26px; color:rgba(255,255,255,0.85); }
svg.p { position:absolute; left:0; top:0; width:1600px; height:900px; overflow:visible; font-family:PJS; }
.chip { position:absolute; left:80px; top:800px; height:60px; padding:0 28px; border-radius:30px; background:#d4a24c; color:#0b1f33; font-weight:800; font-size:26px; line-height:60px; white-space:nowrap; }
.note { position:absolute; right:80px; top:866px; color:rgba(255,255,255,0.6); font-weight:500; font-size:18px; }
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1600" data-height="900">
<div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="0" style="position:absolute;inset:0">
<div class="kick">CAMPING · SHIMLA · KASAULI</div>
<div class="h">From Chandigarh to your tent</div>
<div class="card">
<div class="c" id="c1"><b>Kasauli side</b><span>about 58 km from Chandigarh</span></div>
<div class="c" id="c2"><b>Shimla side</b><span>about 115 km · 3–3.5 h</span></div>
<div class="c" id="c3"><b>Narkanda for snow</b><span>about 60 km beyond Shimla · ~9,000 ft</span></div>
</div>
<svg class="p" viewBox="0 0 1600 900">
<defs><clipPath id="cp"><rect id="cr" x="0" y="0" width="0" height="900"/></clipPath></defs>
<path id="ghost" d="M 140 720 C 235.0 720 235.0 690 330 690 C 425.0 690 425.0 610 520 610 C 610.0 610 610.0 560 700 560 C 800.0 560 800.0 470 900 470 C 980.0 470 980.0 420 1060 420 C 1250.0 420 1250.0 300 1440 300" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6" stroke-dasharray="4 12" stroke-linecap="round"/>
<path id="trail" d="M 140 720 C 235.0 720 235.0 690 330 690 C 425.0 690 425.0 610 520 610 C 610.0 610 610.0 560 700 560 C 800.0 560 800.0 470 900 470 C 980.0 470 980.0 420 1060 420 C 1250.0 420 1250.0 300 1440 300" clip-path="url(#cp)" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<g class="pin" id="pin0"><line x1="520" y1="610" x2="560" y2="500" stroke="#d4a24c" stroke-width="4" stroke-dasharray="6 8" stroke-linecap="round"/><path d="M 542 512 L 560 484 L 578 512 Z" fill="#d4a24c" stroke="#0b1f33" stroke-width="3"/><path d="M 555 512 L 560 502 L 565 512 Z" fill="#0b1f33"/><text x="560" y="464" text-anchor="middle" fill="#d4a24c" font-size="27" font-weight="800">Kasauli · Dharampur</text></g><g class="pin" id="pin1"><line x1="700" y1="560" x2="740" y2="660" stroke="#d4a24c" stroke-width="4" stroke-dasharray="6 8" stroke-linecap="round"/><path d="M 722 672 L 740 644 L 758 672 Z" fill="#d4a24c" stroke="#0b1f33" stroke-width="3"/><path d="M 735 672 L 740 662 L 745 672 Z" fill="#0b1f33"/><text x="740" y="722" text-anchor="middle" fill="#d4a24c" font-size="27" font-weight="800">Sadhupul (Chail side)</text></g><g class="pin" id="pin2"><path d="M 882 482 L 900 454 L 918 482 Z" fill="#d4a24c" stroke="#0b1f33" stroke-width="3"/><path d="M 895 482 L 900 472 L 905 482 Z" fill="#0b1f33"/><text x="890" y="436" text-anchor="middle" fill="#d4a24c" font-size="27" font-weight="800">Shoghi</text></g><g class="pin" id="pin3"><line x1="1060" y1="420" x2="1150" y2="320" stroke="#d4a24c" stroke-width="4" stroke-dasharray="6 8" stroke-linecap="round"/><path d="M 1132 332 L 1150 304 L 1168 332 Z" fill="#d4a24c" stroke="#0b1f33" stroke-width="3"/><path d="M 1145 332 L 1150 322 L 1155 332 Z" fill="#0b1f33"/><text x="1150" y="284" text-anchor="middle" fill="#d4a24c" font-size="27" font-weight="800">Mashobra</text></g><g class="pin" id="pin4"><line x1="1060" y1="420" x2="1170" y2="520" stroke="#d4a24c" stroke-width="4" stroke-dasharray="6 8" stroke-linecap="round"/><path d="M 1152 532 L 1170 504 L 1188 532 Z" fill="#d4a24c" stroke="#0b1f33" stroke-width="3"/><path d="M 1165 532 L 1170 522 L 1175 532 Z" fill="#0b1f33"/><text x="1170" y="582" text-anchor="middle" fill="#d4a24c" font-size="27" font-weight="800">Junga</text></g><g class="pin" id="pin5"><path d="M 1422 312 L 1440 284 L 1458 312 Z" fill="#d4a24c" stroke="#0b1f33" stroke-width="3"/><path d="M 1435 312 L 1440 302 L 1445 312 Z" fill="#0b1f33"/><text x="1440" y="266" text-anchor="end" fill="#d4a24c" font-size="27" font-weight="800">Narkanda</text></g>
<g class="tw" id="tw0"><circle cx="140" cy="720" r="11" fill="#fff"/><text x="140" y="772" text-anchor="start" fill="#fff" font-size="32" font-weight="800">Chandigarh</text></g><g class="tw" id="tw1"><circle cx="330" cy="690" r="8" fill="#fff"/><text x="330" y="742" text-anchor="middle" fill="#fff" font-size="24" font-weight="500">Kalka</text></g><g class="tw" id="tw2"><circle cx="520" cy="610" r="8" fill="#fff"/><text x="520" y="662" text-anchor="middle" fill="#fff" font-size="24" font-weight="500">Dharampur</text></g><g class="tw" id="tw3"><circle cx="700" cy="560" r="8" fill="#fff"/><text x="690" y="535" text-anchor="end" fill="#fff" font-size="24" font-weight="500">Solan</text></g><g class="tw" id="tw5"><circle cx="1060" cy="420" r="11" fill="#fff"/><text x="1045" y="392" text-anchor="end" fill="#fff" font-size="32" font-weight="800">Shimla</text></g>
<circle id="dot" cx="140" cy="720" r="16" fill="#d4a24c" stroke="#fff" stroke-width="5"/>
</svg>
<div class="chip" id="chip">Camp night + cab both ways · Get Quote</div>
<div class="note">Schematic, not to scale · distances approximate</div>
</div></div>
<script>
const tl = gsap.timeline({ paused: true });
const trail = document.getElementById("trail"), dot = document.getElementById("dot"), cr = document.getElementById("cr");
const L = trail.getTotalLength();
function ptAtX(x) { let lo = 0, hi = L; for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2; if (trail.getPointAtLength(m).x < x) lo = m; else hi = m; } return trail.getPointAtLength(lo); }
const st = { p: 0 };
const D = 7.4, T0 = 0.8;
function place() { const x = 140 + st.p * 1300; cr.setAttribute("width", (x + 8).toFixed(1)); const pt = ptAtX(x); dot.setAttribute("cx", pt.x.toFixed(2)); dot.setAttribute("cy", pt.y.toFixed(2)); }
const f = x => (x - 140) / 1300;
tl.set([".tw", ".pin", "#chip", "#c1", "#c2", "#c3"], { opacity: 0 }, 0);
tl.to("#tw0", { opacity: 1, duration: 0.4 }, 0.3);
tl.to(st, { p: 1, duration: D, ease: "none", onUpdate: place }, T0);
[[1,330],[2,520],[3,700],[5,1060]].forEach(([i,x]) => tl.to("#tw" + i, { opacity: 1, duration: 0.3 }, T0 + f(x) * D - 0.1));
[[0,520],[1,700],[2,900],[3,1060],[4,1060],[5,1440]].forEach(([i,x],k) => tl.fromTo("#pin" + i, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, T0 + f(x) * D + (k == 4 ? 0.25 : 0)));
const cs = [["#c1", T0 + f(520) * D], ["#c2", T0 + f(1060) * D], ["#c3", T0 + f(1440) * D - 0.2]];
cs.forEach(([id, t], k) => {
  tl.fromTo(id, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, t);
  if (k < 2) tl.to(id, { opacity: 0, y: -18, duration: 0.3, ease: "power2.in" }, cs[k + 1][1] - 0.35);
});
tl.fromTo("#chip", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 8.9);
tl.to("#root", { opacity: 1, duration: 2.7 }, 9.3);
place();
window.__timelines["main"] = tl;
tl.seek(0);
</script></body></html>
