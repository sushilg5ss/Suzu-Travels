<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.15) 38%, rgba(11,31,51,0.82) 54%, rgba(11,31,51,0.95) 100%); }
      .panel { position: absolute; left: 1020px; top: 0; width: 860px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 96px; color: #d4a24c; font-weight: 800; font-size: 32px; letter-spacing: 0.14em; white-space: nowrap; }
      .t1 { position: absolute; left: 0; top: 146px; color: #fff; font-weight: 800; font-size: 92px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      .t2 { position: absolute; left: 0; top: 258px; color: #d4a24c; font-weight: 800; font-size: 64px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      svg.prof { position: absolute; left: 0; top: 390px; width: 840px; height: 480px; overflow: visible; }
      svg text { font-family: "PJS", sans-serif; font-weight: 800; fill: #fff; font-size: 26px; }
      .bar { position: absolute; left: 0; top: 900px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
      .facts { position: absolute; left: 0; top: 926px; width: 860px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 860px; color: #fff; font-weight: 800; font-size: 44px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="3.2" data-track-index="0"><img id="im1" src="assets/s1.jpg" alt="" /></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="2.6" data-duration="3.2" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/s2.jpg" alt="" style="left:-560px;width:2480px;object-position:50% 60%" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="5.2" data-duration="3.2" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/s3.jpg" alt="" style="left:-460px;object-position:50% 50%" /></div></div>
      <div id="sc4" class="scene clip" data-layout-allow-overflow data-start="7.8" data-duration="3.2" data-track-index="3"><div id="fd4" style="position:absolute;inset:0"><img id="im4" src="assets/s4.jpg" alt="" style="left:-560px;width:2480px;object-position:50% 50%" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="10.6" data-duration="1.4" data-track-index="4"><div id="fd5" style="position:absolute;inset:0"><img id="im5" src="assets/s1.jpg" alt="" /></div></div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="5" style="position:absolute;inset:0">
        <div class="shade"></div>
        <div class="panel">
          <div class="kicker">TREKS &amp; CAMPS · SHIMLA</div>
          <div class="t1">Treks near Shimla</div>
          <div class="t2">From 1 hour to 2 days</div>
          <svg class="prof" viewBox="0 0 840 480">
            <rect x="60" y="340" width="150" height="100" rx="8" fill="rgba(212,162,76,0.22)" />
            <rect x="260" y="249" width="150" height="191" rx="8" fill="rgba(212,162,76,0.30)" />
            <rect x="460" y="132" width="150" height="308" rx="8" fill="rgba(212,162,76,0.38)" />
            <rect x="660" y="78" width="150" height="362" rx="8" fill="rgba(212,162,76,0.48)" />
            <path d="M 135 340 L 335 249 L 535 132 L 735 78" fill="none" stroke="#d4a24c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 14" />
            <path id="route" d="M 135 340 L 335 249 L 535 132 L 735 78" fill="none" stroke="none" />
            <line x1="40" y1="440" x2="830" y2="440" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
            <text x="135" y="476" text-anchor="middle" style="font-size:24px">Jakhu</text>
            <text x="335" y="476" text-anchor="middle" style="font-size:24px">Shali Tibba</text>
            <text x="535" y="476" text-anchor="middle" style="font-size:24px">Hatu Peak</text>
            <text x="735" y="476" text-anchor="middle" style="font-size:24px">Churdhar</text>
            <text x="135" y="420" text-anchor="middle" style="font-size:22px;fill:#fff">~2,455 m</text>
            <text x="335" y="420" text-anchor="middle" style="font-size:22px;fill:#fff">~2,870 m</text>
            <text x="535" y="420" text-anchor="middle" style="font-size:22px;fill:#fff">~3,400 m</text>
            <text x="735" y="420" text-anchor="middle" style="font-size:22px;fill:#fff">~3,647 m</text>
            <text x="40" y="60" style="font-size:22px;fill:#d4a24c;letter-spacing:3px">CLIMB TO</text>
            <text id="alt" x="40" y="128" style="font-size:60px">~2,455 m</text>
            <g id="dot"><circle r="14" fill="#d4a24c" stroke="#fff" stroke-width="4" /></g>
          </svg>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">Town walks · 1–2 hours</div>
            <div class="fact" id="f2">Full-day summits · Shali, Karol, Hatu</div>
            <div class="fact" id="f3">Churdhar · 2 days, the big one</div>
            <div class="fact" id="f4">Snow Dec–Feb · go with a guide</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.07, x: -30, duration: 3.2, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.06, y: 0 }, { scale: 1, y: -30, duration: 3.2, ease: "none" }, 2.6);
      tl.fromTo("#im3", { scale: 1, x: 0 }, { scale: 1.07, x: 30, duration: 3.2, ease: "none" }, 5.2);
      tl.fromTo("#im4", { scale: 1.07, y: 10 }, { scale: 1, y: -10, duration: 3.2, ease: "none" }, 7.8);
      tl.fromTo("#im5", { scale: 1, x: 0 }, { scale: 1, x: 0, duration: 1.4, ease: "none" }, 10.6);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 2.6);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 5.2);
      tl.fromTo("#fd4", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 7.8);
      tl.fromTo("#fd5", { opacity: 0 }, { opacity: 1, duration: 1.35, ease: "sine.inOut" }, 10.6);
      const route = document.getElementById("route");
      const L = route.getTotalLength();
      const dot = document.getElementById("dot");
      const altEl = document.getElementById("alt");
      const stops = [2455, 2870, 3400, 3647];
      function put(t) {
        const a = route.getPointAtLength(L * t);
        dot.setAttribute("transform", "translate(" + a.x.toFixed(2) + "," + a.y.toFixed(2) + ")");
        const seg = Math.min(2, Math.floor(t * 3));
        const f = Math.min(1, t * 3 - seg);
        const v = Math.round((stops[seg] + (stops[seg + 1] - stops[seg]) * f) / 10) * 10;
        const shown = t <= 0.001 ? 2455 : t >= 0.999 ? 3647 : v;
        altEl.textContent = "~" + shown.toLocaleString("en-US") + " m";
      }
      put(0);
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: 1, duration: 9.6, ease: "sine.inOut", immediateRender: false, onUpdate: () => put(st.t) }, 0.5);
      tl.to(["#dot", "#alt"], { opacity: 0, duration: 0.4, ease: "power1.in" }, 10.5);
      const rs = { t: 1 };
      tl.fromTo(rs, { t: 1 }, { t: 0, duration: 0.01, immediateRender: false, onUpdate: () => put(rs.t) }, 11.0);
      tl.to(["#dot", "#alt"], { opacity: 1, duration: 0.55, ease: "power1.out" }, 11.3);
      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 2.7], ["#f2", "#f3", 5.3], ["#f3", "#f4", 7.9], ["#f4", "#f1", 11.1]];
      seq.forEach(([a, b, t]) => {
        tl.to(a, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
