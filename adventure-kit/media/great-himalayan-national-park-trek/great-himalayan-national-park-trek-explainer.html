<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; background: #0b1f33; }
      .bgimg { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; opacity: 0.14; }
      .kick { position: absolute; left: 110px; top: 60px; color: #d4a24c; font-weight: 800; font-size: 28px; letter-spacing: 0.16em; }
      .title { position: absolute; left: 110px; top: 100px; color: #fff; font-weight: 800; font-size: 76px; letter-spacing: -0.02em; }
      .cnt { position: absolute; left: 110px; top: 196px; color: #d4a24c; font-weight: 800; font-size: 72px; text-align: left; white-space: nowrap; }
      .cntlab { position: absolute; left: 110px; top: 286px; color: rgba(255,255,255,0.8); font-weight: 500; font-size: 30px; white-space: nowrap; }
      svg.map { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
      .legend { position: absolute; left: 110px; top: 930px; color: rgba(255,255,255,0.9); font-weight: 500; font-size: 28px; white-space: nowrap; }
      .legend b { display: inline-block; width: 40px; height: 10px; border-radius: 5px; vertical-align: middle; margin: 0 10px 0 0; }
      .chip { position: absolute; right: 110px; top: 950px; background: #d4a24c; color: #0b1f33; font-weight: 800; font-size: 32px; padding: 14px 30px; border-radius: 40px; white-space: nowrap; }
      .note { position: absolute; left: 110px; top: 984px; color: rgba(255,255,255,0.6); font-weight: 500; font-size: 24px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11" data-width="1920" data-height="1080">
      <img id="bgimg" class="bgimg clip" src="assets/s6.jpg" alt="" data-start="0" data-duration="11" data-track-index="0" style="object-position:50% 40%" />
      <div id="ov" class="clip" data-start="0" data-duration="11" data-track-index="1" style="position:absolute;inset:0">
        <div class="kick" id="kick">GREAT HIMALAYAN NATIONAL PARK · KULLU</div>
        <div class="title" id="title">Two gates into the park</div>
        <div class="cnt" id="cnt">1,700 m</div>
        <div class="cntlab" id="cntlab">park height: 1,700 → 5,800 m</div>
        <svg class="map" viewBox="0 0 1920 1080">
<path d="M 170 600 L 420 600" stroke="rgba(255,255,255,0.15)" stroke-width="6" fill="none"/><path d="M 420 600 C 520 600, 560 470, 700 470 L 960 430" stroke="rgba(255,255,255,0.15)" stroke-width="6" fill="none"/><path d="M 420 600 C 520 600, 560 740, 700 740 L 960 760 L 1220 760" stroke="rgba(255,255,255,0.15)" stroke-width="6" fill="none"/>
<path d="M 960 430 C 1080 410, 1140 380, 1240 370 C 1360 358, 1420 320, 1500 310 C 1600 298, 1660 268, 1760 250" stroke="rgba(255,255,255,0.2)" stroke-width="6" fill="none" stroke-dasharray="4 12" stroke-linecap="round"/><path d="M 1220 760 C 1340 760, 1420 730, 1520 720 C 1600 712, 1660 700, 1760 690" stroke="rgba(255,255,255,0.2)" stroke-width="6" fill="none" stroke-dasharray="4 12" stroke-linecap="round"/>
<path id="r0" d="M 170 600 L 420 600" pathLength="1" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<path id="rT" d="M 420 600 C 520 600, 560 470, 700 470 L 960 430" pathLength="1" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<path id="rS" d="M 420 600 C 520 600, 560 740, 700 740 L 960 760 L 1220 760" pathLength="1" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<path id="wT" d="M 960 430 C 1080 410, 1140 380, 1240 370 C 1360 358, 1420 320, 1500 310 C 1600 298, 1660 268, 1760 250" pathLength="1" stroke="#d4a24c" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<path id="wS" d="M 1220 760 C 1340 760, 1420 730, 1520 720 C 1600 712, 1660 700, 1760 690" pathLength="1" stroke="#d4a24c" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="1"/>
<g class="st" id="s0"><circle cx="170" cy="600" r="14" fill="#fff" stroke="#0b1f33" stroke-width="4"/><text x="170" y="656" text-anchor="middle" fill="#fff" font-size="38" font-weight="800" font-family="PJS">Aut</text><text x="170" y="690" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-size="23" font-weight="500" font-family="PJS">from Manali ~70 km</text></g>
<g class="st" id="s1"><circle cx="420" cy="600" r="14" fill="#fff" stroke="#0b1f33" stroke-width="4"/><text x="420" y="570" text-anchor="middle" fill="#fff" font-size="30" font-weight="800" font-family="PJS">Larji</text></g>
<g class="st" id="s2"><circle cx="700" cy="470" r="14" fill="#fff" stroke="#0b1f33" stroke-width="4"/><text x="700" y="526" text-anchor="middle" fill="#fff" font-size="30" font-weight="800" font-family="PJS">Shairopa</text></g>
<g class="st" id="s3"><circle cx="960" cy="430" r="14" fill="#fff" stroke="#0b1f33" stroke-width="4"/><text x="960" y="486" text-anchor="middle" fill="#fff" font-size="30" font-weight="800" font-family="PJS">Gushaini</text><text x="960" y="520" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-size="23" font-weight="500" font-family="PJS">road head · 52 km from Aut</text></g>
<g class="st" id="s4"><circle cx="1240" cy="370" r="14" fill="#fff" stroke="#0b1f33" stroke-width="4"/><text x="1240" y="340" text-anchor="middle" fill="#fff" font-size="30" font-weight="800" font-family="PJS">Rolla</text></g>
<g class="st" id="s5"><circle cx="1500" cy="310" r="14" fill="#fff" stroke="#0b1f33" stroke-width="4"/><text x="1500" y="280" text-anchor="middle" fill="#fff" font-size="30" font-weight="800" font-family="PJS">Shilt</text></g>
<g class="st" id="s6"><circle cx="1760" cy="250" r="18" fill="#d4a24c" stroke="#0b1f33" stroke-width="4"/><text x="1760" y="220" text-anchor="end" fill="#fff" font-size="30" font-weight="800" font-family="PJS">Rakhundi</text></g>
<g class="st" id="s7"><circle cx="700" cy="740" r="14" fill="#fff" stroke="#0b1f33" stroke-width="4"/><text x="700" y="796" text-anchor="middle" fill="#fff" font-size="30" font-weight="800" font-family="PJS">Sainj</text></g>
<g class="st" id="s8"><circle cx="960" cy="760" r="14" fill="#fff" stroke="#0b1f33" stroke-width="4"/><text x="960" y="816" text-anchor="middle" fill="#fff" font-size="30" font-weight="800" font-family="PJS">Ropa</text></g>
<g class="st" id="s9"><circle cx="1220" cy="760" r="14" fill="#fff" stroke="#0b1f33" stroke-width="4"/><text x="1220" y="816" text-anchor="middle" fill="#fff" font-size="30" font-weight="800" font-family="PJS">Neuli</text><text x="1220" y="850" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-size="23" font-weight="500" font-family="PJS">road head · 46 km from Aut</text></g>
<g class="st" id="s10"><circle cx="1760" cy="690" r="18" fill="#d4a24c" stroke="#0b1f33" stroke-width="4"/><text x="1760" y="746" text-anchor="end" fill="#fff" font-size="30" font-weight="800" font-family="PJS">Sainj treks</text></g>
<g class="pin" id="p1"><rect x="638" y="384" width="124" height="44" rx="22" fill="#d4a24c"/><text x="700" y="415" text-anchor="middle" fill="#0b1f33" font-size="22" font-weight="800" font-family="PJS" letter-spacing="2">PERMIT</text><path d="M 691 427 L 700 444 L 709 427 Z" fill="#d4a24c"/></g><g class="pin" id="p2"><rect x="898" y="674" width="124" height="44" rx="22" fill="#d4a24c"/><text x="960" y="705" text-anchor="middle" fill="#0b1f33" font-size="22" font-weight="800" font-family="PJS" letter-spacing="2">PERMIT</text><path d="M 951 717 L 960 734 L 969 717 Z" fill="#d4a24c"/></g>
<text id="labT" x="1140" y="520" fill="#fff" font-size="34" font-weight="800" font-family="PJS">TIRTHAN VALLEY</text>
<text id="labS" x="1240" y="650" fill="#fff" font-size="34" font-weight="800" font-family="PJS">SAINJ VALLEY</text>
</svg>
        <div class="legend" id="legend"><b style="background:#fff"></b>by cab &nbsp;&nbsp; <b style="background:#d4a24c"></b>on foot, with permit</div>
        <div class="note" id="note">Route approved by a range officer · schematic, not to scale</div>
        <div class="chip" id="chip">Permit + certified guide · Get Quote</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#kick", { opacity: 0, y: -16, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.from("#title", { opacity: 0, y: 24, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.from(["#cnt", "#cntlab"], { opacity: 0, duration: 0.4 }, 0.5);
      tl.from(["#s0", "#s1"], { opacity: 0, scale: 0.6, transformOrigin: "50% 50%", duration: 0.4, stagger: 0.12, ease: "back.out(2)" }, 0.5);
      tl.to("#r0", { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "power1.inOut" }, 0.8);
      tl.to(["#rT", "#rS"], { attr: { "stroke-dashoffset": 0 }, duration: 1.4, ease: "power1.inOut" }, 1.6);
      tl.from(["#s2", "#s7"], { opacity: 0, scale: 0.6, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(2)" }, 2.0);
      tl.from(["#s3", "#s8", "#s9"], { opacity: 0, scale: 0.6, transformOrigin: "50% 50%", duration: 0.35, stagger: 0.15, ease: "back.out(2)" }, 2.5);
      tl.from(".pin", { opacity: 0, y: -30, duration: 0.45, stagger: 0.2, ease: "back.out(2)" }, 3.1);
      tl.from(["#labT", "#labS"], { opacity: 0, x: -16, duration: 0.5, stagger: 0.15 }, 3.4);
      tl.to(["#wT", "#wS"], { attr: { "stroke-dashoffset": 0 }, duration: 3.0, ease: "sine.inOut" }, 3.9);
      tl.from(["#s4", "#s5", "#s6"], { opacity: 0, scale: 0.6, transformOrigin: "50% 50%", duration: 0.35, stagger: 0.8, ease: "back.out(2)" }, 4.4);
      tl.from("#s10", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(2)" }, 6.4);
      const cnt = document.getElementById("cnt");
      const c = { p: 0 };
      function upd() { const v = c.p >= 0.999 ? 5800 : Math.round((1700 + c.p * 4100) / 50) * 50; cnt.textContent = v.toLocaleString("en-IN") + " m"; }
      tl.to(c, { p: 1, duration: 3.0, ease: "sine.inOut", onUpdate: upd }, 3.9);
      tl.from("#legend", { opacity: 0, duration: 0.5 }, 7.0);
      tl.from("#note", { opacity: 0, duration: 0.5 }, 7.4);
      tl.fromTo("#chip", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 7.8);
      upd();
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
