<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.1) 38%, rgba(11,31,51,0.76) 56%, rgba(11,31,51,0.9) 100%); }
      .panel { position: absolute; left: 1040px; top: 0; width: 820px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 100px; color: #d4a24c; font-weight: 800; font-size: 34px; letter-spacing: 0.18em; }
      .t1 { position: absolute; left: 0; top: 150px; color: #fff; font-weight: 800; font-size: 84px; line-height: 1.02; letter-spacing: -0.02em; }
      .t2 { position: absolute; left: 0; top: 240px; color: #d4a24c; font-weight: 800; font-size: 84px; line-height: 1.02; letter-spacing: -0.02em; }
      .big { position: absolute; left: 0; top: 360px; width: 520px; color: #fff; font-weight: 800; font-size: 88px; line-height: 1; letter-spacing: -0.02em; white-space: nowrap; }
      .biglab { position: absolute; left: 4px; top: 462px; width: 520px; white-space: nowrap; color: rgba(255,255,255,0.85); font-weight: 500; font-size: 28px; }
      svg.prof { position: absolute; left: 0; top: 520px; width: 820px; height: 330px; overflow: visible; }
      .facts { position: absolute; left: 0; top: 890px; width: 820px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 820px; color: #fff; font-weight: 800; font-size: 50px; white-space: nowrap; }
      .bar { position: absolute; left: 0; top: 870px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="3.8" data-track-index="0"><img id="im1" src="assets/s1.jpg" alt="" style="object-position:45% 60%" /></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="3" data-duration="3.8" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/s2.jpg" alt="" style="object-position:50% 60%" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="6" data-duration="3.8" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/s3.jpg" alt="" style="object-position:50% 45%" /></div></div>
      <div id="sc4" class="scene clip" data-layout-allow-overflow data-start="9" data-duration="3" data-track-index="3"><div id="fd4" style="position:absolute;inset:0"><img id="im4" src="assets/s4.jpg" alt="" style="object-position:30% 50%" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="10.8" data-duration="1.2" data-track-index="4"><img id="im5" src="assets/s1.jpg" alt="" style="object-position:45% 60%" /></div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="5" style="position:absolute;inset:0">
        <div class="shade"></div>
        <div class="panel">
          <div class="kicker">VASHISHT · MANALI</div>
          <div class="t1">Jogini</div>
          <div class="t2">Waterfall Walk</div>
          <div class="big" id="alt">0 km</div>
          <div class="biglab">walked from Vashisht temple</div>
          <svg class="prof" viewBox="0 0 820 330">
            <path id="ghost" d="M 10 290 C 140 286 220 250 330 236 C 450 220 520 200 640 170" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="5" stroke-dasharray="4 12" stroke-linecap="round" />
            <g id="fall">
              <path d="M 640 40 L 640 170" stroke="rgba(255,255,255,0.25)" stroke-width="30" stroke-linecap="round" fill="none" />
              <path id="w1" d="M 630 40 L 630 170" stroke="#fff" stroke-width="5" stroke-dasharray="18 22" stroke-linecap="round" fill="none" />
              <path id="w2" d="M 650 40 L 650 170" stroke="#d4a24c" stroke-width="5" stroke-dasharray="26 18" stroke-linecap="round" fill="none" />
            </g>
            <text x="10" y="335" fill="rgba(255,255,255,0.85)" font-size="26" font-weight="500" font-family="PJS">Vashisht temple</text>
            <text x="330" y="206" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="26" font-weight="500" font-family="PJS">Orchard trail</text>
            <text x="680" y="120" fill="#fff" font-size="28" font-weight="800" font-family="PJS">The fall</text>
            <text x="680" y="156" fill="rgba(255,255,255,0.85)" font-size="24" font-weight="500" font-family="PJS">~150 ft</text>
            <defs><clipPath id="cp"><rect id="cr" x="0" y="-40" width="0" height="420" /></clipPath></defs>
            <path id="trail" d="M 10 290 C 140 286 220 250 330 236 C 450 220 520 200 640 170" clip-path="url(#cp)" fill="none" stroke="#d4a24c" stroke-width="9" stroke-linecap="round" />
            <circle cx="10" cy="290" r="9" fill="#fff" /><circle cx="330" cy="236" r="8" fill="#fff" /><circle cx="640" cy="170" r="12" fill="#fff" />
            <g id="g-dot"><circle id="dot" cx="10" cy="290" r="15" fill="#d4a24c" stroke="#fff" stroke-width="5" /></g>
          </svg>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">3–4 km from Vashisht</div>
            <div class="fact" id="f2">About 1–1.5 hr up</div>
            <div class="fact" id="f3">Easy · open all year</div>
            <div class="fact" id="f4">Back by lunch</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.08, x: -30, duration: 3.8, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.08, y: 20 }, { scale: 1, y: -20, duration: 3.8, ease: "none" }, 3);
      tl.fromTo("#im3", { scale: 1, y: 0 }, { scale: 1.07, y: -30, duration: 3.8, ease: "none" }, 6);
      tl.fromTo("#im4", { scale: 1.07, y: 10 }, { scale: 1, y: -10, duration: 3, ease: "none" }, 9);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 3);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 6);
      tl.fromTo("#fd4", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 9);
      tl.fromTo("#im5", { opacity: 0 }, { opacity: 1, duration: 1.15, ease: "sine.inOut" }, 10.8);
      tl.fromTo("#w1", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -480 }, duration: 12, ease: "none" }, 0);
      tl.fromTo("#w2", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -660 }, duration: 12, ease: "none" }, 0);
      const trail = document.getElementById("trail"), dot = document.getElementById("dot"), alt = document.getElementById("alt"), cr = document.getElementById("cr");
      const L = trail.getTotalLength();
      const st = { p: 0 };
      function place() {
        const pt = trail.getPointAtLength(st.p * L);
        cr.setAttribute("width", (pt.x + 6).toFixed(1));
        dot.setAttribute("cx", pt.x.toFixed(2)); dot.setAttribute("cy", pt.y.toFixed(2));
        const km = Math.round(st.p * 3.5 * 2) / 2;
        alt.textContent = st.p >= 0.999 ? "3–4 km" : (km === 0 ? "0 km" : km.toFixed(1) + " km");
      }
      tl.to(st, { p: 1, duration: 8.4, ease: "sine.inOut", onUpdate: place }, 0.6);
      tl.to(["#trail", "#g-dot", "#alt"], { opacity: 0, duration: 0.4 }, 10.2);
      tl.to(st, { p: 0, duration: 0.05, onUpdate: place }, 10.7);
      tl.to(["#trail", "#g-dot", "#alt"], { opacity: 1, duration: 0.6 }, 11.2);
      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 2.6], ["#f2", "#f3", 5.4], ["#f3", "#f4", 8.2], ["#f4", "#f1", 11.0]];
      seq.forEach(([a, b, t]) => {
        tl.to(a, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      place();
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
