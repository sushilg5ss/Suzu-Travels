<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.08) 38%, rgba(11,31,51,0.8) 54%, rgba(11,31,51,0.94) 100%); }
      .panel { position: absolute; left: 1020px; top: 0; width: 860px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 100px; color: #d4a24c; font-weight: 800; font-size: 34px; letter-spacing: 0.16em; }
      .t1 { position: absolute; left: 0; top: 148px; color: #fff; font-weight: 800; font-size: 108px; line-height: 1.02; letter-spacing: -0.02em; }
      .t2 { position: absolute; left: 0; top: 258px; color: #d4a24c; font-weight: 800; font-size: 100px; line-height: 1.02; letter-spacing: -0.02em; }
      svg.cast { position: absolute; left: 0; top: 400px; width: 840px; height: 220px; overflow: visible; }
      .mlab { position: absolute; left: 0; top: 650px; color: #fff; font-weight: 800; font-size: 30px; letter-spacing: 0.08em; white-space: nowrap; }
      svg.months { position: absolute; left: 0; top: 700px; width: 840px; height: 150px; overflow: visible; }
      .bar { position: absolute; left: 0; top: 896px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
      .facts { position: absolute; left: 0; top: 922px; width: 860px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 860px; color: #fff; font-weight: 800; font-size: 52px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="3.6" data-track-index="0"><img id="im1" src="assets/s1.jpg" alt="" /></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="2.8" data-duration="3.4" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/s2.jpg" alt="" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="5.4" data-duration="3.4" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/s3.jpg" alt="" /></div></div>
      <div id="sc4" class="scene clip" data-layout-allow-overflow data-start="8.0" data-duration="4.0" data-track-index="3"><div id="fd4" style="position:absolute;inset:0"><img id="im4" src="assets/s4.jpg" alt="" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="10.8" data-duration="1.2" data-track-index="4"><img id="im5" src="assets/s1.jpg" alt="" /></div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="5" style="position:absolute;inset:0">
        <div class="shade"></div>
        <div class="panel">
          <div class="kicker">ANGLING · HIMACHAL PRADESH</div>
          <div class="t1">Trout fishing</div>
          <div class="t2">in Himachal</div>
          <svg class="cast" viewBox="0 0 840 220">
            <path id="line" d="M 20 200 C 180 -40, 520 -30, 700 150" fill="none" stroke="#d4a24c" stroke-width="5" stroke-linecap="round" />
            <path d="M 0 170 Q 210 158 420 170 T 840 170" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3" />
            <ellipse id="rp1" cx="700" cy="170" rx="60" ry="12" fill="none" stroke="#ffffff" stroke-width="4" />
            <ellipse id="rp2" cx="700" cy="170" rx="60" ry="12" fill="none" stroke="#d4a24c" stroke-width="4" />
            <g id="fly"><circle cx="0" cy="0" r="10" fill="#d4a24c" /><path d="M -4 -6 L -22 -20 M 4 -6 L 18 -22" stroke="#ffffff" stroke-width="4" stroke-linecap="round" /></g>
          </svg>
          <div class="mlab"><span style="color:#d4a24c">TROUT SEASON</span> · 1 MAR – 31 OCT</div>
          <svg class="months" viewBox="0 0 840 150" id="msvg"></svg>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">Brown &amp; rainbow trout</div>
            <div class="fact" id="f2">Licence for each stream</div>
            <div class="fact" id="f3">Spoons &amp; flies only</div>
            <div class="fact" id="f4">Closed 1 Nov – end Feb</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.07, x: -30, duration: 3.6, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.08, x: 20 }, { scale: 1, x: -20, duration: 3.4, ease: "none" }, 2.8);
      tl.fromTo("#im3", { scale: 1, y: 0 }, { scale: 1.07, y: -20, duration: 3.4, ease: "none" }, 5.4);
      tl.fromTo("#im4", { scale: 1.06, x: 0 }, { scale: 1, x: -24, duration: 4.0, ease: "none" }, 8.0);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 2.8);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 5.4);
      tl.fromTo("#fd4", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 8.0);
      tl.fromTo("#im5", { opacity: 0 }, { opacity: 1, duration: 1.15, ease: "sine.inOut" }, 10.8);

      // casting line: draws, fly lands, ripples, line retracts before loop end
      const line = document.getElementById("line"); const L = line.getTotalLength();
      line.style.strokeDasharray = L; line.style.strokeDashoffset = L;
      const fly = document.getElementById("fly");
      const st = { d: 0 };
      function putFly() { const p = line.getPointAtLength(L * st.d); fly.setAttribute("transform", "translate(" + p.x.toFixed(2) + "," + p.y.toFixed(2) + ")"); fly.setAttribute("opacity", st.d > 0.01 ? 1 : 0); line.style.strokeDashoffset = (L * (1 - st.d)).toFixed(2); }
      putFly();
      tl.fromTo(st, { d: 0 }, { d: 1, duration: 1.3, ease: "power2.out", immediateRender: false, onUpdate: putFly }, 0.5);
      tl.to(st, { d: 0, duration: 0.8, ease: "power2.in", onUpdate: putFly }, 11.0);
      ["#rp1", "#rp2"].forEach((r, i) => {
        tl.set(r, { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, 0);
        [1.8, 5.8].forEach(t0 => {
          tl.fromTo(r, { opacity: 0.95, scale: 0.2 }, { opacity: 0, scale: 1.6, duration: 1.6, ease: "sine.out", immediateRender: false }, t0 + i * 0.45);
        });
      });

      // 12-month strip: Mar–Oct light up gold
      const M = "JFMAMJJASOND".split(""); const svg = document.getElementById("msvg"); const NS = "http://www.w3.org/2000/svg";
      const dots = [];
      M.forEach((m, i) => {
        const x = 35 + i * 70;
        const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", x); c.setAttribute("cy", 40); c.setAttribute("r", 26);
        c.setAttribute("fill", "rgba(255,255,255,0.08)"); c.setAttribute("stroke", "rgba(255,255,255,0.55)"); c.setAttribute("stroke-width", 3); svg.appendChild(c);
        const t = document.createElementNS(NS, "text"); t.setAttribute("x", x); t.setAttribute("y", 51); t.setAttribute("text-anchor", "middle");
        t.setAttribute("font-family", "PJS"); t.setAttribute("font-weight", "800"); t.setAttribute("font-size", "30"); t.setAttribute("fill", "#ffffff"); t.textContent = m; svg.appendChild(t);
        dots.push([c, t, i >= 2 && i <= 9]);
      });
      const cl = document.createElementNS(NS, "text"); cl.setAttribute("x", 35); cl.setAttribute("y", 112); cl.setAttribute("font-family", "PJS"); cl.setAttribute("font-weight", "800"); cl.setAttribute("font-size", "26"); cl.setAttribute("fill", "rgba(255,255,255,0.75)"); cl.setAttribute("letter-spacing", "2"); cl.textContent = "NOV – FEB: CLOSED FOR BREEDING"; svg.appendChild(cl);
      dots.forEach(([c, t, open], i) => {
        if (!open) return;
        const k = i - 2;
        tl.to(c, { attr: { fill: "#d4a24c", stroke: "#d4a24c" }, duration: 0.25 }, 2.0 + k * 0.28);
        tl.to(t, { attr: { fill: "#0b1f33" }, duration: 0.25 }, 2.0 + k * 0.28);
        tl.to(c, { attr: { fill: "rgba(255,255,255,0.08)", stroke: "rgba(255,255,255,0.55)" }, duration: 0.3 }, 10.6 + k * 0.08);
        tl.to(t, { attr: { fill: "#ffffff" }, duration: 0.3 }, 10.6 + k * 0.08);
      });

      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 2.6], ["#f2", "#f3", 5.2], ["#f3", "#f4", 7.8], ["#f4", "#f1", 10.6]];
      seq.forEach(([a, b, t]) => {
        tl.to(a, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
