<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.1) 38%, rgba(11,31,51,0.76) 56%, rgba(11,31,51,0.9) 100%); }
      .panel { position: absolute; left: 1040px; top: 0; width: 820px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 150px; color: #d4a24c; font-weight: 800; font-size: 34px; letter-spacing: 0.18em; }
      .t1 { position: absolute; left: 0; top: 200px; color: #fff; font-weight: 800; font-size: 124px; line-height: 1.02; letter-spacing: -0.02em; }
      .t2 { position: absolute; left: 0; top: 334px; color: #d4a24c; font-weight: 800; font-size: 112px; line-height: 1.02; letter-spacing: -0.02em; }
      svg.river { position: absolute; left: 0; top: 480px; width: 820px; height: 220px; overflow: visible; }
      .big { position: absolute; left: 0; top: 712px; width: 420px; color: #fff; font-weight: 800; font-size: 84px; letter-spacing: -0.02em; white-space: nowrap; }
      .biglab { position: absolute; left: 430px; top: 736px; width: 390px; text-align: right; color: rgba(255,255,255,0.88); font-weight: 500; font-size: 30px; line-height: 1.25; }
      .facts { position: absolute; left: 0; top: 880px; width: 820px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 820px; color: #fff; font-weight: 800; font-size: 52px; white-space: nowrap; }
      .bar { position: absolute; left: 0; top: 860px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
      .spark { position: absolute; left: 0; top: 0; width: 8px; height: 8px; border-radius: 50%; background: #ffcf7a; box-shadow: 0 0 12px 4px rgba(255,170,60,0.7); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="3.8" data-track-index="0"><img id="im1" src="assets/s1.jpg" alt="" /></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="3" data-duration="3.8" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/s2.jpg" alt="" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="6" data-duration="3.8" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/s3.jpg" alt="" /></div></div>
      <div id="sc4" class="scene clip" data-layout-allow-overflow data-start="9" data-duration="3" data-track-index="3"><div id="fd4" style="position:absolute;inset:0"><img id="im4" src="assets/s4.jpg" alt="" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="10.8" data-duration="1.2" data-track-index="4"><img id="im5" src="assets/s1.jpg" alt="" /></div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="5" style="position:absolute;inset:0">
        <div class="shade"></div>
        <div id="sparks" data-layout-allow-overflow style="position:absolute;inset:0"></div>
        <div class="panel">
          <div class="kicker">CAMPS · PARVATI VALLEY</div>
          <div class="t1">Camping</div>
          <div class="t2">in Kasol</div>
          <svg class="river" viewBox="0 0 820 220">
            <path d="M 0 160 C 90 120, 160 200, 250 160 S 410 110, 500 150 S 680 200, 810 130" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="24" stroke-linecap="round" />
            <path id="river" d="M 0 160 C 90 120, 160 200, 250 160 S 410 110, 500 150 S 680 200, 810 130" fill="none" stroke="#d4a24c" stroke-width="8" stroke-linecap="round" stroke-dasharray="30 26" />
            <circle id="glow" cx="605" cy="70" r="64" fill="rgba(255,190,90,0.2)" />
            <path d="M 560 105 L 605 30 L 650 105 Z" fill="#d4a24c" />
            <path d="M 595 105 L 605 70 L 615 105 Z" fill="#0b1f33" />
          </svg>
          <div class="big" id="alt">~1,580 m</div>
          <div class="biglab">tents by the Parvati river</div>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">~30 km from Bhuntar</div>
            <div class="fact" id="f2">Kasol · Chalal · Tosh</div>
            <div class="fact" id="f3">Best Mar–Jun &amp; Sep–Nov</div>
            <div class="fact" id="f4">Registered camps only</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.08, x: -30, duration: 3.8, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.08, x: 20 }, { scale: 1, x: -20, duration: 3.8, ease: "none" }, 3);
      tl.fromTo("#im3", { scale: 1, y: 0 }, { scale: 1.07, y: -20, duration: 3.8, ease: "none" }, 6);
      tl.fromTo("#im4", { scale: 1.07, y: 10 }, { scale: 1, y: -10, duration: 3, ease: "none" }, 9);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 3);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 6);
      tl.fromTo("#fd4", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 9);
      tl.fromTo("#im5", { opacity: 0 }, { opacity: 1, duration: 1.15, ease: "sine.inOut" }, 10.8);
      // flowing river: dash period 56 px, offset -672 = 12 whole periods, so last frame = first frame
      tl.fromTo("#river", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -672 }, duration: 12, ease: "none" }, 0);
      // tent glow breathes 3 full cycles
      tl.fromTo("#glow", { attr: { r: 56 } }, { attr: { r: 76 }, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);
      // rising campfire sparks on the right half; seeded positions, each spark does exactly 3 cycles in 12 s
      const box = document.getElementById("sparks");
      let seed = 7;
      const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
      for (let i = 0; i < 18; i++) {
        const s = document.createElement("div");
        s.className = "spark";
        box.appendChild(s);
        const x0 = 1080 + rnd() * 780;
        const off = rnd();
        const sway = 20 + rnd() * 30;
        const st = { p: off };
        const place = () => {
          const p = st.p % 1;
          const o = p < 0.15 ? p / 0.15 : (p > 0.75 ? Math.max(0, (1 - p) / 0.25) : 1);
          s.style.transform = "translate(" + (x0 + Math.sin(p * Math.PI * 4) * sway).toFixed(1) + "px," + (1100 - p * 720).toFixed(1) + "px)";
          s.style.opacity = (o * 0.85).toFixed(3);
        };
        tl.fromTo(st, { p: off }, { p: off + 3, duration: 12, ease: "none", onUpdate: place }, 0);
        place();
      }
      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 2.6], ["#f2", "#f3", 5.4], ["#f3", "#f4", 8.2], ["#f4", "#f1", 11.0]];
      seq.forEach(([a, b, t]) => {
        tl.to(a, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
