<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.1) 38%, rgba(11,31,51,0.82) 54%, rgba(11,31,51,0.95) 100%); }
      .panel { position: absolute; left: 1020px; top: 0; width: 860px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 96px; color: #d4a24c; font-weight: 800; font-size: 32px; letter-spacing: 0.14em; white-space: nowrap; }
      .t1 { position: absolute; left: 0; top: 146px; color: #fff; font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      .t2 { position: absolute; left: 0; top: 258px; color: #d4a24c; font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      svg.map { position: absolute; left: 0; top: 392px; width: 840px; height: 480px; overflow: visible; }
      svg text { font-family: "PJS", sans-serif; font-weight: 800; fill: #fff; font-size: 30px; }
      .bar { position: absolute; left: 0; top: 900px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
      .facts { position: absolute; left: 0; top: 926px; width: 860px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 860px; color: #fff; font-weight: 800; font-size: 48px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="3.4" data-track-index="0"><img id="im1" src="assets/s1.jpg" alt="" /></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="2.8" data-duration="3.4" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/s2.jpg" alt="" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="5.6" data-duration="3.4" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/s3.jpg" alt="" /></div></div>
      <div id="sc4" class="scene clip" data-layout-allow-overflow data-start="8.4" data-duration="3.4" data-track-index="3"><div id="fd4" style="position:absolute;inset:0"><img id="im4" src="assets/s5.jpg" alt="" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="11.6" data-duration="1.4" data-track-index="4"><div id="fd5" style="position:absolute;inset:0"><img id="im5" src="assets/s1.jpg" alt="" /></div></div>
      <div id="ov" class="clip" data-start="0" data-duration="13" data-track-index="5" style="position:absolute;inset:0">
        <div class="shade"></div>
        <div class="panel">
          <div class="kicker">PLACE GUIDE · BIR, KANGRA</div>
          <div class="t1">Fly, jump,</div>
          <div class="t2">trek &amp; stay</div>
          <svg class="map" viewBox="0 0 840 480">
            <text x="90" y="14" style="font-size:28px">Billing ~2,400 m</text>
            <path id="route" d="M 40 50 C 270 50 360 210 540 250 C 660 276 730 290 800 300" fill="none" stroke="#d4a24c" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 22" />
            <circle cx="40" cy="50" r="10" fill="#d4a24c" />
            <circle cx="800" cy="300" r="10" fill="#d4a24c" />
            <text x="800" y="350" text-anchor="end" style="font-size:28px">Bir ~1,400 m</text>
            <text x="30" y="140" style="font-size:24px;fill:#d4a24c;letter-spacing:3px">ALTITUDE</text>
            <text id="alt" x="30" y="248" style="font-size:76px">2,400 m</text>
            <g id="glider">
              <path d="M -34 -6 C -20 -26 20 -26 34 -6" fill="none" stroke="#d4a24c" stroke-width="9" stroke-linecap="round" />
              <line x1="-28" y1="-8" x2="0" y2="18" stroke="#fff" stroke-width="2.5" /><line x1="28" y1="-8" x2="0" y2="18" stroke="#fff" stroke-width="2.5" />
              <circle cx="0" cy="22" r="6" fill="#fff" />
            </g>
            <g id="ic1" transform="translate(90,420)"><circle r="40" fill="#0b1f33" stroke="#d4a24c" stroke-width="5"/><path d="M -22 -2 C -12 -18 12 -18 22 -2" fill="none" stroke="#d4a24c" stroke-width="7" stroke-linecap="round"/><line x1="-17" y1="-4" x2="0" y2="13" stroke="#fff" stroke-width="3"/><line x1="17" y1="-4" x2="0" y2="13" stroke="#fff" stroke-width="3"/><circle cy="17" r="4" fill="#fff"/></g>
            <g id="ic2" transform="translate(300,420)"><circle r="40" fill="#0b1f33" stroke="#d4a24c" stroke-width="5"/><line x1="-20" y1="-24" x2="20" y2="-24" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M 0 -24 C -8 -12 8 -4 0 6" fill="none" stroke="#d4a24c" stroke-width="4"/><circle cx="0" cy="12" r="6" fill="#fff"/><line x1="0" y1="18" x2="0" y2="26" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
            <g id="ic3" transform="translate(510,420)"><circle r="40" fill="#0b1f33" stroke="#d4a24c" stroke-width="5"/><path d="M -24 -4 L 0 -20 L 24 -4 Z" fill="#d4a24c"/><rect x="-16" y="-4" width="32" height="22" fill="#fff"/><rect x="-5" y="6" width="10" height="12" fill="#0b1f33"/><line x1="0" y1="-20" x2="0" y2="-28" stroke="#d4a24c" stroke-width="3"/></g>
            <g id="ic4" transform="translate(720,420)"><circle r="40" fill="#0b1f33" stroke="#d4a24c" stroke-width="5"/><path d="M -24 18 L 0 -20 L 24 18 Z" fill="#d4a24c"/><path d="M -6 18 L 0 4 L 6 18 Z" fill="#0b1f33"/><circle cx="-20" cy="-18" r="2.5" fill="#fff"/><circle cx="18" cy="-22" r="2.5" fill="#fff"/></g>
            <text x="90" y="490" text-anchor="middle" style="font-size:24px">Fly</text>
            <text x="300" y="490" text-anchor="middle" style="font-size:24px">Bungee</text>
            <text x="510" y="490" text-anchor="middle" style="font-size:24px">Monasteries</text>
            <text x="720" y="490" text-anchor="middle" style="font-size:24px">Camp</text>
          </svg>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">Take off at Billing, land in Bir</div>
            <div class="fact" id="f2">Best: mid-Sep–Nov, Mar–Jun</div>
            <div class="fact" id="f3">2–3 days is ideal</div>
            <div class="fact" id="f4">One valley, one quote</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.07, x: -30, duration: 3.4, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.06, y: 0 }, { scale: 1, y: -30, duration: 3.4, ease: "none" }, 2.8);
      tl.fromTo("#im3", { scale: 1, x: 0 }, { scale: 1.07, x: 30, duration: 3.4, ease: "none" }, 5.6);
      tl.fromTo("#im4", { scale: 1.07, y: 10 }, { scale: 1, y: -10, duration: 3.4, ease: "none" }, 8.4);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 2.8);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 5.6);
      tl.fromTo("#fd4", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 8.4);
      tl.fromTo("#fd5", { opacity: 0 }, { opacity: 1, duration: 1.35, ease: "sine.inOut" }, 11.6);
      tl.fromTo("#route", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -252 }, duration: 13, ease: "none" }, 0);
      const route = document.getElementById("route");
      const L = route.getTotalLength();
      const g = document.getElementById("glider");
      const alt = document.getElementById("alt");
      function put(t) {
        const a = route.getPointAtLength(L * t);
        g.setAttribute("transform", "translate(" + a.x.toFixed(2) + "," + (a.y - 28).toFixed(2) + ")");
        const m = Math.round((2400 - 1000 * t) / 10) * 10;
        alt.textContent = m.toLocaleString("en-US") + " m";
      }
      put(0);
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: 1, duration: 10.6, ease: "sine.inOut", immediateRender: false, onUpdate: () => put(st.t) }, 0.5);
      tl.to("#glider", { opacity: 0, duration: 0.4, ease: "power1.in" }, 11.5);
      const rs = { t: 1 };
      tl.fromTo(rs, { t: 1 }, { t: 0, duration: 0.01, immediateRender: false, onUpdate: () => put(rs.t) }, 12.0);
      tl.to("#glider", { opacity: 1, duration: 0.55, ease: "power1.out" }, 12.3);
      [["#ic1", 1.0], ["#ic2", 3.4], ["#ic3", 6.2], ["#ic4", 9.0]].forEach(([p, t]) => {
        tl.fromTo(p + " > circle", { attr: { "stroke-width": 5 } }, { attr: { "stroke-width": 12 }, duration: 0.35, ease: "power2.out", immediateRender: false }, t);
        tl.to(p + " > circle", { attr: { "stroke-width": 5 }, duration: 0.45, ease: "power2.in" }, t + 0.35);
      });
      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 3.0], ["#f2", "#f3", 6.0], ["#f3", "#f4", 9.0], ["#f4", "#f1", 12.0]];
      seq.forEach(([a, b, t]) => {
        tl.to(a, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
