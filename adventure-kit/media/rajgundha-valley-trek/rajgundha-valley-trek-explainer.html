<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; background: #0b1f33; }
      .bgimg { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; opacity: 0.16; }
      .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0.55), rgba(11,31,51,0.92) 60%); }
      svg.map { position: absolute; left: 60px; top: 90px; width: 1000px; height: 900px; overflow: visible; }
      svg.map text { font-family: "PJS", sans-serif; font-weight: 800; fill: #fff; font-size: 30px; }
      svg.map text.sm { font-size: 24px; font-weight: 500; fill: rgba(255,255,255,0.85); }
      svg.map text.km { fill: #0b1f33; font-size: 28px; }
      .panel { position: absolute; left: 1120px; top: 0; width: 740px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 96px; color: #d4a24c; font-weight: 800; font-size: 32px; letter-spacing: 0.16em; white-space: nowrap; }
      .h { position: absolute; left: 0; top: 150px; color: #fff; font-weight: 800; font-size: 96px; letter-spacing: -0.02em; white-space: nowrap; }
      .alt { position: absolute; left: 0; top: 276px; color: #d4a24c; font-weight: 800; font-size: 120px; letter-spacing: -0.02em; white-space: nowrap; }
      .altlab { position: absolute; left: 0; top: 420px; color: #fff; font-weight: 500; font-size: 36px; white-space: nowrap; }
      .leg { position: absolute; left: 0; width: 740px; height: 50px; color: #fff; font-weight: 800; font-size: 34px; white-space: nowrap; }
      .leg i { position: absolute; left: 0; top: 22px; width: 64px; height: 0; }
      .leg span { position: absolute; left: 88px; top: 0; }
      .cal { position: absolute; left: 0; top: 760px; width: 740px; height: 200px; }
      .m { position: absolute; top: 0; width: 56px; height: 76px; border-radius: 10px; background: #d4a24c; color: #0b1f33; font-weight: 800; font-size: 26px; text-align: center; line-height: 76px; }
      .m.off { background: rgba(255,255,255,0.18); color: rgba(255,255,255,0.75); }
      .caltxt { position: absolute; left: 0; top: 92px; width: 740px; line-height: 1.25; color: #fff; font-weight: 800; font-size: 34px; white-space: nowrap; }
      .caltxt b { color: #d4a24c; }
      .note { position: absolute; left: 60px; top: 1010px; color: rgba(255,255,255,0.6); font-weight: 500; font-size: 22px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="0" style="position:absolute;inset:0">
        <img class="bgimg" id="bgim" src="assets/takeoff.jpg" alt="" />
        <div class="veil"></div>
      </div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="1" style="position:absolute;inset:0">
        <svg class="map" viewBox="0 0 1000 900">
          <path id="rdB" d="M150 780 C 200 700, 260 690, 300 620 C 330 570, 360 560, 390 520" fill="none" stroke="#d4a24c" stroke-width="10" stroke-linecap="round" />
          <path id="rdR" d="M900 780 C 880 700, 860 640, 840 560 C 830 520, 815 500, 800 470" fill="none" stroke="#d4a24c" stroke-width="10" stroke-linecap="round" />
          <path id="tkA" d="M390 520 C 450 460, 500 470, 560 410 C 610 360, 640 330, 690 300" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="4 18" stroke-linecap="round" />
          <path id="tkB" d="M800 470 C 780 420, 750 380, 720 330 C 710 315, 700 305, 690 300" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="4 18" stroke-linecap="round" />
          <circle id="walk1" cx="390" cy="520" r="12" fill="#fff" />
          <circle id="walk2" cx="800" cy="470" r="12" fill="#fff" />
          <circle id="halo" cx="690" cy="300" r="0" fill="rgba(212,162,76,0.45)" />
          <circle cx="690" cy="300" r="22" fill="#d4a24c" stroke="#fff" stroke-width="5" />
          <text x="560" y="214">Rajgundha</text>
          <text class="sm" x="560" y="250">~2,700 m · camps &amp; homestays</text>
          <circle cx="150" cy="780" r="14" fill="#fff" /><text x="70" y="842">Bir</text><text class="sm" x="128" y="842">~1,400 m</text>
          <circle cx="390" cy="520" r="14" fill="#fff" /><text x="150" y="500">Billing</text><text class="sm" x="150" y="534">~2,400 m</text><text class="sm" x="150" y="566">take-off</text>
          <circle cx="900" cy="780" r="14" fill="#fff" /><text x="850" y="842">Barot</text>
          <circle cx="800" cy="470" r="10" fill="#fff" /><text class="sm" x="822" y="478">roadhead</text>
          <g id="kmB"><rect x="320" y="640" width="160" height="48" rx="24" fill="#d4a24c" /><text class="km" x="400" y="674" text-anchor="middle">14 km road</text></g>
          <g id="kmA"><rect x="380" y="370" width="240" height="48" rx="24" fill="#fff" /><text class="km" x="500" y="404" text-anchor="middle">12–14 km · 5–6 h</text></g>
          <g id="kmR"><rect x="770" y="330" width="170" height="48" rx="24" fill="#fff" /><text class="km" x="855" y="364" text-anchor="middle">short walk</text></g>
          <text class="sm" id="drv" x="640" y="880">~65 km drive Bir → Barot</text>
        </svg>
        <div class="note">Schematic, not to scale · heights per the Kangra district page</div>
        <div class="panel">
          <div class="kicker">2 WAYS IN · BIR BILLING</div>
          <div class="h">Rajgundha</div>
          <div class="alt" id="alt">~1,400 m</div>
          <div class="altlab">Chhota Bhangal, Kangra</div>
          <div class="leg" id="lg1" style="top:510px"><i style="border-top:10px solid #d4a24c;top:18px"></i><span>Road · cab to the trail head</span></div>
          <div class="leg" id="lg2" style="top:580px"><i style="border-top:6px dotted #fff"></i><span>Classic walk from Billing</span></div>
          <div class="leg" id="lg3" style="top:650px"><i style="border-top:6px dotted #fff"></i><span>Shorter way in, Barot side</span></div>
          <div class="cal" id="cal"></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const D = 12;
      tl.fromTo("#bgim", { scale: 1 }, { scale: 1.06, duration: D, ease: "none" }, 0);
      tl.from([".kicker", ".h"], { opacity: 0, y: 30, duration: 0.5, stagger: 0.12, ease: "power2.out" }, 0.1);
      tl.from(".altlab", { opacity: 0, duration: 0.4 }, 0.6);
      const prep = (id) => { const p = document.getElementById(id); const L = Math.ceil(p.getTotalLength()); p.setAttribute("stroke-dasharray", L + " " + L); p.setAttribute("stroke-dashoffset", L); return { p, L }; };
      const B = prep("rdB"), R = prep("rdR");
      tl.to(B.p, { attr: { "stroke-dashoffset": 0 }, duration: 1.6, ease: "power1.inOut" }, 0.7);
      tl.from("#kmB", { opacity: 0, scale: 0.6, transformOrigin: "400px 664px", duration: 0.3 }, 1.0);
      tl.from("#lg1", { opacity: 0, x: -20, duration: 0.4 }, 0.9);
      tl.from("#tkA", { opacity: 0, duration: 0.5 }, 2.3);
      tl.from("#kmA", { opacity: 0, scale: 0.6, transformOrigin: "500px 394px", duration: 0.35 }, 2.6);
      tl.from("#lg2", { opacity: 0, x: -20, duration: 0.4 }, 2.4);
      tl.fromTo("#halo", { attr: { r: 0 }, opacity: 0.9 }, { attr: { r: 60 }, opacity: 0, duration: 1.2, ease: "power1.out" }, 5.0);
      tl.from("#drv", { opacity: 0, duration: 0.4 }, 5.4);
      tl.to(R.p, { attr: { "stroke-dashoffset": 0 }, duration: 1.4, ease: "power1.inOut" }, 5.5);
      tl.from("#tkB", { opacity: 0, duration: 0.5 }, 6.8);
      tl.from("#kmR", { opacity: 0, scale: 0.6, transformOrigin: "855px 354px", duration: 0.35 }, 7.0);
      tl.from("#lg3", { opacity: 0, x: -20, duration: 0.4 }, 6.9);
      const tA = document.getElementById("tkA"), tB = document.getElementById("tkB");
      const LA = tA.getTotalLength(), LB = tB.getTotalLength();
      const w1 = document.getElementById("walk1"), w2 = document.getElementById("walk2");
      const altEl = document.getElementById("alt");
      const st = { t: 0 };
      const ss = (a, b, t) => { let k = (t - a) / (b - a); k = Math.max(0, Math.min(1, k)); return k * k * (3 - 2 * k); };
      const upd = () => {
        const t = st.t;
        const v = 1400 + ss(0.7, 2.3, t) * 1000 + ss(2.6, 5.0, t) * 300;
        altEl.textContent = "~" + (Math.round(v / 10) * 10).toLocaleString("en-US") + " m";
        const k1 = ss(2.6, 5.0, t), k2 = ss(7.0, 8.4, t);
        const p1 = tA.getPointAtLength(k1 * LA), p2 = tB.getPointAtLength(k2 * LB);
        w1.setAttribute("cx", p1.x.toFixed(1)); w1.setAttribute("cy", p1.y.toFixed(1));
        w2.setAttribute("cx", p2.x.toFixed(1)); w2.setAttribute("cy", p2.y.toFixed(1));
        w1.setAttribute("opacity", t < 2.4 ? 0 : 1); w2.setAttribute("opacity", t < 6.9 ? 0 : 1);
      };
      tl.fromTo(st, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: upd }, 0);
      const cal = document.getElementById("cal");
      const M = ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"];
      const boxes = M.map((m, i) => { const b = document.createElement("div"); b.className = "m"; b.textContent = m; b.style.left = (i * 62) + "px"; cal.appendChild(b); return b; });
      const tx = document.createElement("div"); tx.className = "caltxt"; tx.innerHTML = "Best Mar–Jun &amp; Sep–Oct<br /><b>Snow closes access</b> Dec–Mar"; cal.appendChild(tx);
      tl.from(boxes, { opacity: 0, y: 20, duration: 0.2, stagger: 0.02, ease: "power2.out" }, 8.2);
      [0, 1, 11].forEach((i, n) => { tl.to(boxes[i], { backgroundColor: "rgba(255,255,255,0.18)", color: "rgba(255,255,255,0.75)", duration: 0.3 }, 9.3 + n * 0.08); });
      tl.from(tx, { opacity: 0, y: 16, duration: 0.4 }, 9.7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
