<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.1) 38%, rgba(11,31,51,0.8) 56%, rgba(11,31,51,0.93) 100%); }
      .panel { position: absolute; left: 1040px; top: 0; width: 820px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 96px; color: #d4a24c; font-weight: 800; font-size: 32px; letter-spacing: 0.16em; white-space: nowrap; }
      .t1 { position: absolute; left: 0; top: 160px; color: #fff; font-weight: 800; font-size: 112px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      .t2 { position: absolute; left: 0; top: 280px; color: #d4a24c; font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      .t3 { position: absolute; left: 0; top: 404px; color: #fff; font-weight: 500; font-size: 44px; white-space: nowrap; }
      svg.prof { position: absolute; left: 0; top: 500px; width: 820px; height: 230px; overflow: visible; }
      svg.prof text { font-family: "PJS", sans-serif; font-weight: 800; font-size: 26px; fill: #fff; }
      .big { position: absolute; left: 0; top: 724px; color: #fff; font-weight: 800; font-size: 88px; letter-spacing: -0.02em; white-space: nowrap; }
      .biglab { position: absolute; left: 440px; top: 744px; width: 380px; text-align: right; color: rgba(255,255,255,0.92); font-weight: 800; font-size: 32px; line-height: 1.15; white-space: nowrap; }
      .bar { position: absolute; left: 0; top: 866px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
      .facts { position: absolute; left: 0; top: 890px; width: 820px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 820px; color: #fff; font-weight: 800; font-size: 42px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="3.8" data-track-index="0"><div style="position:absolute;inset:0"><img id="im1" src="assets/gondola.jpg" alt="" style="object-position:50% 50%" /></div></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="3" data-duration="3.8" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/snowvalley.jpg" alt="" style="object-position:40% 50%" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="6" data-duration="3.8" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/base.jpg" alt="" style="object-position:20% 40%" /></div></div>
      <div id="sc4" class="scene clip" data-layout-allow-overflow data-start="9" data-duration="2.75" data-track-index="3"><div id="fd4" style="position:absolute;inset:0"><img id="im4" src="assets/para.jpg" alt="" style="object-position:20% 40%" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="10.8" data-duration="1.2" data-track-index="4"><div id="fd5" style="position:absolute;inset:0"><img id="im5" src="assets/gondola.jpg" alt="" style="object-position:50% 50%" /></div></div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="5" style="position:absolute;inset:0">
        <div class="shade"></div>
        <div class="panel">
          <div class="kicker">ROPEWAYS · SOLANG VALLEY</div>
          <div class="t1">Solang</div>
          <div class="t2">Ropeway</div>
          <div class="t3">Valley floor up to Fatru</div>
          <svg class="prof" viewBox="0 0 820 230">
            <path d="M0 230 L80 214 L170 200 L260 176 L360 150 L450 132 L540 96 L620 70 L700 50 L820 66" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
            <path id="cable" d="M70 196 Q 380 168 690 26" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="4" stroke-linecap="round" />
            <path id="gold" d="M70 196 Q 380 168 690 26" fill="none" stroke="#d4a24c" stroke-width="7" stroke-linecap="round" />
            <circle cx="70" cy="196" r="12" fill="#fff" />
            <circle cx="690" cy="26" r="14" fill="#d4a24c" stroke="#fff" stroke-width="4" />
            <text x="40" y="160" text-anchor="start">SOLANG ~2,500 m</text>
            <text x="690" y="-14" text-anchor="middle" style="fill:#d4a24c">FATRU ~3,200 m</text>
            <g id="cab"><line x1="0" y1="0" x2="0" y2="18" stroke="#fff" stroke-width="4" /><rect x="-20" y="16" width="40" height="32" rx="8" fill="#d4a24c" stroke="#fff" stroke-width="3" /><rect x="-12" y="22" width="24" height="10" rx="3" fill="#0b1f33" /></g>
          </svg>
          <div class="big" id="alt">2,500 m</div>
          <div class="biglab">+700 m in about<br />5–10 minutes</div>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">About 1.3 km of cable</div>
            <div class="fact" id="f2">About 8 people per cabin</div>
            <div class="fact" id="f3">13–14 km from Manali</div>
            <div class="fact" id="f4">Stops in wind &amp; heavy snow</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const D = 12;
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.08, x: -30, duration: 3.8, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.08, y: 10 }, { scale: 1, y: -10, duration: 3.8, ease: "none" }, 3);
      tl.fromTo("#im3", { scale: 1, x: 0 }, { scale: 1.07, x: -24, duration: 3.8, ease: "none" }, 6);
      tl.fromTo("#im4", { scale: 1.07, y: 10 }, { scale: 1, y: -10, duration: 2.75, ease: "none" }, 9);
      tl.fromTo("#im5", { scale: 1, x: 0 }, { scale: 1, x: 0, duration: 1.2, ease: "none" }, 10.8);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 3);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 6);
      tl.fromTo("#fd4", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 9);
      tl.fromTo("#fd5", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "sine.inOut" }, 10.8);

      // periodic cabin: bottom at t=0 and t=D (seamless loop), top at t=D/2
      const gold = document.getElementById("gold");
      const cable = document.getElementById("cable");
      const L = gold.getTotalLength();
      gold.setAttribute("stroke-dasharray", L.toFixed(1) + " " + (L + 10).toFixed(1));
      const cab = document.getElementById("cab");
      const altEl = document.getElementById("alt");
      const st = { t: 0 };
      const upd = () => {
        const k = (1 - Math.cos((st.t / D) * 2 * Math.PI)) / 2;
        const p = cable.getPointAtLength(k * L);
        cab.setAttribute("transform", "translate(" + p.x.toFixed(1) + "," + p.y.toFixed(1) + ")");
        gold.setAttribute("stroke-dashoffset", (L * (1 - k)).toFixed(1));
        altEl.textContent = (Math.round((2500 + k * 700) / 10) * 10).toLocaleString("en-IN") + " m";
      };
      tl.fromTo(st, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: upd }, 0);

      const fx = [["#f1", 0, 2.6], ["#f2", 2.9, 5.5], ["#f3", 5.8, 8.4], ["#f4", 8.7, 11.3]];
      gsap.set(["#f2", "#f3", "#f4"], { opacity: 0 });
      fx.forEach(([id, a, b], i) => {
        if (i > 0) tl.fromTo(id, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, a);
        tl.to(id, { opacity: 0, y: -18, duration: 0.3, ease: "power2.in" }, b);
      });
      tl.fromTo("#f1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 11.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
      upd();
    </script>
  </body>
</html>
