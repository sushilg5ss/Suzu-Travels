</div></div>
<script>
const tl = gsap.timeline({ paused: true });
const trail = document.getElementById("trail"), dot = document.getElementById("dot"), cr = document.getElementById("cr"), km = document.getElementById("km");
const L = trail.getTotalLength();
function ptAtX(x) { let lo = 0, hi = L; for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2; if (trail.getPointAtLength(m).x < x) lo = m; else hi = m; } return trail.getPointAtLength(lo); }
const st = { p: 0 };
function place() { const x = 140 + st.p * 1320; cr.setAttribute("width", (x + 8).toFixed(1)); const pt = ptAtX(x); dot.setAttribute("cx", pt.x.toFixed(2)); dot.setAttribute("cy", pt.y.toFixed(2)); km.textContent = "Day " + Math.min(11, 1 + Math.floor(st.p * 10.999)); }
tl.set([".st", "#badge", "#chip", "#kaza"], { opacity: 0 }, 0);
tl.to("#st0", { opacity: 1, duration: 0.4 }, 0.3);
tl.to(st, { p: 1, duration: 7.6, ease: "none", onUpdate: place }, 0.8);
[[1,0.11],[2,0.23],[3,0.34],[4,0.45],[5,0.56],[6,0.67],[7,0.78],[8,1]].forEach(([i,f]) => tl.to("#st" + i, { opacity: 1, duration: 0.35 }, 0.8 + f * 7.6 - 0.15));
tl.fromTo("#badge", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 0.8 + 0.56 * 7.6);
tl.fromTo("#kaza", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 8.5);
tl.fromTo("#chip", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 8.8);
tl.to("#root", { opacity: 1, duration: 3.1 }, 8.9);
place();
window.__timelines["main"] = tl;
tl.seek(0);
</script></body></html>
