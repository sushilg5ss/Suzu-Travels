<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.12) 38%, rgba(11,31,51,0.8) 56%, rgba(11,31,51,0.93) 100%); }
      #dust { position: absolute; inset: 0; }
      .fl { position: absolute; left: 0; top: 0; border-radius: 50%; background: #fff; }
      .panel { position: absolute; left: 1040px; top: 0; width: 820px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 96px; line-height: 1.1; color: #d4a24c; font-weight: 800; font-size: 32px; letter-spacing: 0.16em; }
      .t1 { position: absolute; left: 0; top: 160px; color: #fff; font-weight: 800; font-size: 112px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      .t2 { position: absolute; left: 0; top: 280px; color: #d4a24c; font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      .t3 { position: absolute; left: 0; top: 400px; color: #fff; font-weight: 500; font-size: 46px; white-space: nowrap; }
      svg.prof { position: absolute; left: 0; top: 470px; width: 820px; height: 240px; overflow: visible; }
      .big { position: absolute; left: 0; top: 724px; color: #fff; font-weight: 800; font-size: 92px; letter-spacing: -0.02em; white-space: nowrap; }
      .biglab { position: absolute; left: 470px; top: 748px; width: 350px; text-align: right; color: rgba(255,255,255,0.92); font-weight: 800; font-size: 36px; line-height: 1.15; }
      .bar { position: absolute; left: 0; top: 866px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
      .facts { position: absolute; left: 0; top: 890px; width: 820px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 820px; color: #fff; font-weight: 800; font-size: 50px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="3.8" data-track-index="0"><div style="position:absolute;inset:0"><img id="im1" src="assets/meadow.jpg" alt="" style="object-position:30% 60%" /></div></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="3" data-duration="3.8" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/atvcouple.jpg" alt="" style="object-position:30% 55%" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="6" data-duration="3.8" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/riders.jpg" alt="" style="object-position:50% 45%" /></div></div>
      <div id="sc4" class="scene clip" data-layout-allow-overflow data-start="9" data-duration="3" data-track-index="3"><div id="fd4" style="position:absolute;inset:0"><img id="im4" src="assets/snow.jpg" alt="" style="object-position:30% 50%" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="10.8" data-duration="1.2" data-track-index="4"><div id="fd5" style="position:absolute;inset:0"><img id="im5" src="assets/meadow.jpg" alt="" style="object-position:30% 60%" /></div></div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="5" style="position:absolute;inset:0">
        <div id="dust" data-layout-allow-overflow></div>
        <div class="shade"></div>
        <div class="panel">
          <div class="kicker">LAND RIDES · SOLANG VALLEY</div>
          <div class="t1">Zorbing</div>
          <div class="t2">&amp; ATV rides</div>
          <div class="t3">roll the slope · ride the trail</div>
          <svg class="prof" viewBox="0 0 820 240">
            <path d="M 0 110 C 180 116 300 150 460 186 S 700 222 820 226" fill="none" stroke="rgba(140,200,120,0.35)" stroke-width="30" stroke-linecap="round" />
            <path id="ln1" d="M 0 110 C 180 116 300 150 460 186 S 700 222 820 226" fill="none" stroke="#d4a24c" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 10" />
            <g id="ball"><g transform="scale(0.8)">
              <circle r="54" fill="rgba(255,255,255,0.18)" stroke="#fff" stroke-width="5" />
              <circle r="30" fill="rgba(212,162,76,0.25)" stroke="#d4a24c" stroke-width="4" />
              <g id="spin"><line x1="-54" y1="0" x2="-30" y2="0" stroke="#fff" stroke-width="3" /><line x1="30" y1="0" x2="54" y2="0" stroke="#fff" stroke-width="3" /><line x1="0" y1="-54" x2="0" y2="-30" stroke="#fff" stroke-width="3" /><line x1="0" y1="30" x2="0" y2="54" stroke="#fff" stroke-width="3" /><circle cx="0" cy="-10" r="9" fill="#fff" /><path d="M -12 2 L 0 16 L 12 2" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" /></g>
              <path d="M -36 -28 A 46 46 0 0 1 -8 -46" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="6" stroke-linecap="round" />
            </g></g>
          </svg>
          <div class="big" id="alt">0 km</div>
          <div class="biglab">from Manali town<br />to Solang Valley</div>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">A zorb ride takes about 10 min</div>
            <div class="fact" id="f2">Strapped in with a harness</div>
            <div class="fact" id="f3">ATV quads on short trails</div>
            <div class="fact" id="f4">Best on clear days, Oct–Jun</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const D = 12;
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.08, x: -30, duration: 3.8, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.08, x: 20 }, { scale: 1, x: -20, duration: 3.8, ease: "none" }, 3);
      tl.fromTo("#im3", { scale: 1, y: 0 }, { scale: 1.06, y: -20, duration: 3.8, ease: "none" }, 6);
      tl.fromTo("#im4", { scale: 1.07, x: 10 }, { scale: 1, x: -10, duration: 3, ease: "none" }, 9);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 3);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 6);
      tl.fromTo("#fd4", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 9);
      tl.fromTo("#fd5", { opacity: 0 }, { opacity: 1, duration: 1.15, ease: "sine.inOut" }, 10.8);
      tl.fromTo("#ln1", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": 336 }, duration: D, ease: "none" }, 0);
      // rolling zorb ball: 3 runs of 4 s down the slope, fades in at top / out at bottom (periodic => seamless)
      const path = document.getElementById("ln1");
      const L = path.getTotalLength();
      const ball = document.getElementById("ball"), spin = document.getElementById("spin");
      const altEl = document.getElementById("alt");
      const st = { t: 0 };
      const upd = () => {
        const ph = (st.t % 4) / 4;
        const e = ph * ph * (1.6 - 0.6 * ph);
        const d = 40 + e * (L - 80);
        const p = path.getPointAtLength(d);
        ball.setAttribute("transform", `translate(${p.x.toFixed(1)},${(p.y - 40).toFixed(1)})`);
        spin.setAttribute("transform", `rotate(${(d / 43 * 57.2958).toFixed(1)})`);
        const op = Math.min(1, ph / 0.08, (1 - ph) / 0.1);
        ball.setAttribute("opacity", Math.max(0, op).toFixed(3));
        let t = st.t; if (t >= 11.55) t = 0;
        let k = (t - 0.8) / 2.6; k = Math.max(0, Math.min(1, k)); const s = k * k * (3 - 2 * k);
        altEl.textContent = s >= 1 ? "13–14 km" : Math.round(14 * s) + " km";
      };
      tl.fromTo(st, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: upd }, 0);
      tl.to("#alt", { opacity: 0, duration: 0.3, ease: "power1.in" }, 11.2);
      tl.fromTo("#alt", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out", immediateRender: false }, 11.55);
      // drifting dust/snow specks (periodic)
      let seed = 71;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      const dust = document.getElementById("dust");
      const fl = [];
      for (let i = 0; i < 46; i++) {
        const el = document.createElement("div"); el.className = "fl"; const r = 3 + rnd() * 6;
        el.style.width = r + "px"; el.style.height = r + "px"; el.style.opacity = (0.25 + rnd() * 0.45).toFixed(2); dust.appendChild(el);
        fl.push({ el, x: rnd() * 1920, y: rnd() * 1200, c: 1 + Math.floor(rnd() * 2), w: rnd() * 6.28 });
      }
      const fx = { t: 0 };
      const fxUpd = () => {
        const p = fx.t / D;
        fl.forEach((f) => {
          const y = ((f.y + p * f.c * 1200) % 1200) - 60;
          const x = f.x + Math.sin(p * 6.2832 * f.c + f.w) * 30;
          f.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
        });
      };
      tl.fromTo(fx, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: fxUpd }, 0);
      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 2.6], ["#f2", "#f3", 5.4], ["#f3", "#f4", 8.2], ["#f4", "#f1", 11.0]];
      seq.forEach(([a, b, t]) => {
        tl.to(a, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
      upd(); fxUpd();
    </script>
  </body>
</html>
