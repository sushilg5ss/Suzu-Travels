<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; background: #0b1f33; }
      .kicker { position: absolute; left: 120px; top: 64px; color: #d4a24c; font-weight: 800; font-size: 32px; letter-spacing: 0.16em; }
      .title { position: absolute; left: 120px; top: 106px; color: #fff; font-weight: 800; font-size: 84px; letter-spacing: -0.02em; }
      svg.prof { position: absolute; left: 120px; top: 230px; width: 1680px; height: 420px; overflow: visible; }
      .lab { position: absolute; color: #fff; font-weight: 800; font-size: 40px; white-space: nowrap; }
      .lab small { display: block; color: #d4a24c; font-weight: 500; font-size: 30px; }
      .months { position: absolute; left: 120px; top: 760px; width: 1680px; height: 90px; }
      .m { position: absolute; top: 0; width: 132px; height: 60px; border-radius: 12px; background: #1d4266; }
      .ml { position: absolute; top: 68px; width: 132px; text-align: center; color: #fff; font-weight: 500; font-size: 26px; }
      .closed { position: absolute; top: 0; height: 60px; border-radius: 12px; background: repeating-linear-gradient(135deg, #4a5a6a 0 14px, #3a4856 14px 28px); }
      .closedl { position: absolute; top: 11px; color: #fff; font-weight: 800; font-size: 28px; white-space: nowrap; }
      .legend { position: absolute; left: 120px; top: 704px; color: #fff; font-weight: 800; font-size: 32px; white-space: nowrap; }
      .chips { position: absolute; left: 120px; top: 916px; width: 1680px; height: 90px; }
      .chip { position: absolute; top: 0; height: 84px; padding: 0 40px; border-radius: 42px; font-weight: 800; font-size: 40px; line-height: 84px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="0" style="position:absolute;inset:0">
        <div class="kicker" id="k">KHAJJIAR · NEAR DALHOUSIE</div>
        <div class="title" id="ti">Your Khajjiar morning</div>
        <svg class="prof" viewBox="0 0 1680 420">
          <path id="ground" d="M 0 300 L 60 230 Q 150 110 250 130 Q 340 150 400 260 Q 470 340 600 330 Q 680 320 760 260 L 1680 260" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          <g id="town" fill="rgba(255,255,255,0.85)">
            <rect x="150" y="98" width="28" height="36" /><rect x="186" y="86" width="34" height="48" /><rect x="228" y="98" width="30" height="34" /><rect x="266" y="106" width="26" height="34" />
          </g>
          <path id="road" d="M 300 150 Q 420 300 600 318 Q 700 310 790 262" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round" />
          <g id="meadow"><path d="M 790 262 L 1680 262 L 1680 330 Q 1230 360 790 330 Z" fill="rgba(120,190,110,0.5)" />
          <g fill="rgba(40,100,60,0.95)" stroke="rgba(255,255,255,0.7)" stroke-width="2"><path d="M 820 214 l -16 42 h 32 Z" /><path d="M 870 200 l -16 42 h 32 Z" /><path d="M 920 192 l -16 42 h 32 Z" /><path d="M 1640 214 l -16 42 h 32 Z" /><path d="M 1590 200 l -16 42 h 32 Z" /><path d="M 1540 194 l -16 42 h 32 Z" /></g>
          <ellipse cx="1230" cy="298" rx="70" ry="16" fill="rgba(110,170,220,0.8)" /></g>
          <path id="route" d="M 960 250 C 1060 40 1300 30 1400 150 C 1450 210 1480 240 1500 252" fill="none" stroke="#d4a24c" stroke-width="8" stroke-linecap="round" />
          <circle id="to" cx="960" cy="256" r="18" fill="#d4a24c" stroke="#0b1f33" stroke-width="5" />
          <circle id="land" cx="1504" cy="256" r="16" fill="#ffffff" stroke="#0b1f33" stroke-width="5" />
          <g id="glider">
            <path d="M -40 -16 Q 0 -46 40 -16" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" />
            <line x1="-32" y1="-17" x2="0" y2="14" stroke="#fff" stroke-width="3" />
            <line x1="32" y1="-17" x2="0" y2="14" stroke="#fff" stroke-width="3" />
            <circle cx="-5" cy="17" r="8" fill="#d4a24c" /><circle cx="7" cy="20" r="8" fill="#fff" />
          </g>
        </svg>
        <div class="lab" id="l1" style="left:440px; top:270px">Dalhousie<small>start by cab</small></div>
        <div class="lab" id="l2" style="left:470px; top:580px">≈ 24 km · about 1 hr</div>
        <div class="lab" id="l3" style="left:1020px; top:580px">Khajjiar meadow · ~1,920 m<small>launch at Dadota or Lahara, your pilot picks by wind</small></div>
        <div class="legend" id="lg"><span style="color:#d4a24c">■</span> Flying &nbsp;&nbsp; <span style="color:#7aa0c4">■</span> Weather days &nbsp;&nbsp; <span style="color:#7a8a9a">■</span> No flying</div>
        <div class="months" id="mo"></div>
        <div class="chips">
          <div class="chip" id="ch1" style="left:0; background:#d4a24c; color:#0b1f33">Open again since 16 Sep 2026</div>
          <div class="chip" id="ch2" style="left:720px; border:3px solid #fff; color:#fff; line-height:78px">12+ yrs · 30 kg+</div>
          <div class="chip" id="ch3" style="left:1180px; background:#fff; color:#0b1f33">Price: Get Quote</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const mo = document.getElementById("mo");
      const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const best = [2,3,4,9,10];
      const fair = [0,1,5,11];
      const W = 140;
      const boxes = [];
      names.forEach((n, i) => {
        const b = document.createElement("div"); b.className = "m"; b.style.left = (i * W) + "px"; mo.appendChild(b); boxes.push(b);
        const l = document.createElement("div"); l.className = "ml"; l.style.left = (i * W) + "px"; l.textContent = n; mo.appendChild(l);
      });
      const cl = document.createElement("div"); cl.className = "closed"; cl.id = "cl";
      cl.style.left = (6 * W) + "px"; cl.style.width = (3 * W - 8) + "px"; mo.appendChild(cl);
      const cll = document.createElement("div"); cll.className = "closedl"; cll.id = "cll";
      cll.style.left = (6 * W + 24) + "px"; cll.textContent = "Monsoon: no flying"; mo.appendChild(cll);

      const route = document.getElementById("route");
      const L = route.getTotalLength();
      const glider = document.getElementById("glider");
      function put(t) {
        const a = route.getPointAtLength(L * t);
        glider.setAttribute("transform", "translate(" + a.x.toFixed(2) + "," + (a.y - 34).toFixed(2) + ")");
      }
      put(0);
      tl.set(route, { strokeDasharray: L + " " + L, strokeDashoffset: L }, 0);
      tl.set("#glider", { opacity: 0 }, 0);

      tl.fromTo("#k", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo("#ti", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.25);
      tl.fromTo("#ground", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.7);
      tl.fromTo("#town", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 1.0);
      tl.fromTo(["#road", "#meadow"], { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.2);
      tl.fromTo("#l2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.3);
      tl.fromTo("#to", { scale: 0, transformOrigin: "center" }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 1.3);
      tl.fromTo("#l1", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5 }, 1.4);
      tl.to("#glider", { opacity: 1, duration: 0.3 }, 1.8);
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: 1, duration: 3.0, ease: "sine.inOut", immediateRender: false, onUpdate: () => put(st.t) }, 1.9);
      tl.to(route, { strokeDashoffset: 0, duration: 3.0, ease: "sine.inOut" }, 1.9);
      
      tl.fromTo("#land", { attr: { fill: "#ffffff" } }, { attr: { fill: "#d4a24c" }, duration: 0.3, immediateRender: false }, 4.9);
      tl.fromTo("#l3", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.5 }, 1.7);

      tl.fromTo("#lg", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.6);
      boxes.forEach((b, i) => {
        tl.fromTo(b, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 5.7 + i * 0.06);
        if (best.includes(i)) tl.to(b, { backgroundColor: "#d4a24c", duration: 0.35 }, 6.8 + best.indexOf(i) * 0.1);
        if (fair.includes(i)) tl.to(b, { backgroundColor: "#7aa0c4", duration: 0.35 }, 7.2 + fair.indexOf(i) * 0.08);
      });
      tl.fromTo(".ml", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.0);
      tl.fromTo("#cl", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, transformOrigin: "left center", duration: 0.6, ease: "power2.out" }, 7.8);
      tl.fromTo("#cll", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 8.2);
      tl.fromTo("#ch1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(2)" }, 8.9);
      tl.fromTo("#ch2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(2)" }, 9.2);
      tl.fromTo("#ch3", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(2)" }, 9.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
