<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.12) 38%, rgba(11,31,51,0.8) 56%, rgba(11,31,51,0.93) 100%); }
      #snow { position: absolute; inset: 0; }
      .fl { position: absolute; left: 0; top: 0; border-radius: 50%; background: #fff; }
      .panel { position: absolute; left: 1040px; top: 0; width: 820px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 118px; color: #d4a24c; font-weight: 800; font-size: 32px; letter-spacing: 0.16em; }
      .t1 { position: absolute; left: 0; top: 166px; color: #fff; font-weight: 800; font-size: 112px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      .t2 { position: absolute; left: 0; top: 292px; color: #d4a24c; font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; }
      svg.prof { position: absolute; left: 0; top: 440px; width: 820px; height: 260px; overflow: visible; }
      svg.prof text { font-family: "PJS", sans-serif; font-weight: 800; font-size: 26px; fill: #fff; }
      .big { position: absolute; left: 0; top: 724px; color: #fff; font-weight: 800; font-size: 92px; letter-spacing: -0.02em; white-space: nowrap; }
      .biglab { position: absolute; left: 420px; top: 748px; width: 400px; text-align: right; color: rgba(255,255,255,0.92); font-weight: 800; font-size: 40px; }
      .bar { position: absolute; left: 0; top: 866px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
      .facts { position: absolute; left: 0; top: 890px; width: 820px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 820px; color: #fff; font-weight: 800; font-size: 50px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="3.8" data-track-index="0"><img id="im1" src="assets/forest.jpg" alt="" /></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="3" data-duration="3.8" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/slope.jpg" alt="" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="6" data-duration="3.8" data-track-index="2"><div id="fd3" style="position:absolute;inset:0;transform:scaleX(-1)"><img id="im3" src="assets/sled.jpg" alt="" /></div></div>
      <div id="sc4" class="scene clip" data-layout-allow-overflow data-start="9" data-duration="3" data-track-index="3"><div id="fd4" style="position:absolute;inset:0"><img id="im4" src="assets/range.jpg" alt="" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="10.8" data-duration="1.2" data-track-index="4"><img id="im5" src="assets/forest.jpg" alt="" /></div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="5" style="position:absolute;inset:0">
        <div class="shade"></div>
        <div id="snow"></div>
        <div class="panel">
          <div class="kicker">SNOW · SKIING · NARKANDA</div>
          <div class="t1">Snow &amp; skiing</div>
          <div class="t2">in Narkanda</div>
          <svg class="prof" viewBox="0 0 820 260">
            <path d="M 0 250 L 60 190 L 130 214 L 250 150 L 330 176 L 470 92 L 560 120 L 700 26 L 820 70" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />
            <path id="ln1" d="M 60 190 L 250 150 L 470 92 L 700 26" fill="none" stroke="#d4a24c" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 10" />
            <g id="dots"></g>
            <text x="60" y="242" text-anchor="middle">Shimla</text>
            <text x="250" y="204" text-anchor="middle">Kufri</text>
            <text x="470" y="146" text-anchor="middle">Narkanda</text>
            <text x="700" y="80" text-anchor="middle">Hatu Peak</text>
          </svg>
          <div class="big" id="alt">~2,200 m</div>
          <div class="biglab" id="altlab">Shimla</div>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">63–65 km beyond Shimla</div>
            <div class="fact" id="f2">Snow usually late Dec–Feb</div>
            <div class="fact" id="f3">Ski lessons Jan–Mar</div>
            <div class="fact" id="f4">No permit needed</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const D = 12;
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.08, x: -30, duration: 3.8, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.08, x: 20 }, { scale: 1, x: -20, duration: 3.8, ease: "none" }, 3);
      tl.fromTo("#im3", { scale: 1, y: 0 }, { scale: 1.05, y: -20, duration: 3.8, ease: "none" }, 6);
      tl.fromTo("#im4", { scale: 1.07, y: 10 }, { scale: 1, y: -10, duration: 3, ease: "none" }, 9);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 3);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 6);
      tl.fromTo("#fd4", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 9);
      tl.fromTo("#im5", { opacity: 0 }, { opacity: 1, duration: 1.15, ease: "sine.inOut" }, 10.8);
      // gold trail: period 28 px, offset -336 = 12 whole periods -> seamless
      tl.fromTo("#ln1", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -336 }, duration: D, ease: "none" }, 0);
      const NS = "http://www.w3.org/2000/svg";
      const g = document.getElementById("dots");
      const stops = [[60, 190], [250, 150], [470, 92], [700, 26]];
      const halos = stops.map((p) => {
        const h = document.createElementNS(NS, "circle");
        h.setAttribute("cx", p[0]); h.setAttribute("cy", p[1]); h.setAttribute("r", 0); h.setAttribute("fill", "rgba(212,162,76,0.4)");
        const d = document.createElementNS(NS, "circle");
        d.setAttribute("cx", p[0]); d.setAttribute("cy", p[1]); d.setAttribute("r", 12); d.setAttribute("fill", "#d4a24c"); d.setAttribute("stroke", "#fff"); d.setAttribute("stroke-width", 4);
        g.appendChild(h); g.appendChild(d); return h;
      });
      // altitude counter: Shimla ~2,200 -> Kufri ~2,500 -> Narkanda ~2,708 -> Hatu ~3,400; resets under a fade at the loop seam
      const keys = [[0, 2200, 0], [1.4, 2200, 0], [2.2, 2500, 1], [4.2, 2500, 1], [5.0, 2708, 2], [7.0, 2708, 2], [7.8, 3400, 3], [12.01, 3400, 3]];
      const labels = ["Shimla", "Kufri", "Narkanda", "Hatu Peak"];
      const altEl = document.getElementById("alt"), labEl = document.getElementById("altlab");
      const st = { t: 0 };
      const upd = () => {
        let t = st.t; if (t >= 11.55) t = 0;
        let v = 2200, idx = 0;
        for (let i = 0; i < keys.length - 1; i++) {
          const [t0, v0, i0] = keys[i], [t1, v1, i1] = keys[i + 1];
          if (t >= t0 && t < t1) { const k = (t - t0) / (t1 - t0); const e = k * k * (3 - 2 * k); v = v0 + (v1 - v0) * e; idx = k > 0.5 ? i1 : i0; break; }
        }
        altEl.textContent = "~" + Math.round(v).toLocaleString("en-US") + " m";
        labEl.textContent = labels[idx];
        const s = 0.5 + 0.5 * Math.sin(st.t * Math.PI * 2 / 1.5);
        halos.forEach((h, i) => { const on = i === idx; h.setAttribute("r", (on ? 18 + s * 18 : 0).toFixed(2)); h.setAttribute("opacity", on ? (0.4 + 0.6 * s).toFixed(3) : "0"); });
      };
      tl.fromTo(st, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: upd }, 0);
      tl.to(["#alt", "#altlab"], { opacity: 0, duration: 0.3, ease: "power1.in" }, 11.2);
      tl.fromTo(["#alt", "#altlab"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out", immediateRender: false }, 11.55);
      // seeded snow: each flake falls a whole number of cycles in 12 s -> seamless
      let seed = 7;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      const snow = document.getElementById("snow");
      const flakes = [];
      for (let i = 0; i < 90; i++) {
        const el = document.createElement("div"); el.className = "fl";
        const s = 3 + rnd() * 6; el.style.width = s + "px"; el.style.height = s + "px"; el.style.opacity = (0.45 + rnd() * 0.5).toFixed(2);
        snow.appendChild(el);
        flakes.push({ el, x: rnd() * 1920, y: rnd() * 1140, c: 1 + Math.floor(rnd() * 2), w: 1 + Math.floor(rnd() * 3), a: 10 + rnd() * 30, ph: rnd() * 6.283 });
      }
      const snowSt = { t: 0 };
      const snowUpd = () => {
        const p = snowSt.t / D;
        flakes.forEach((f) => {
          const y = ((f.y + p * f.c * 1140) % 1140) - 40;
          const x = f.x + Math.sin(p * f.w * 6.283 + f.ph) * f.a;
          f.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
        });
      };
      tl.fromTo(snowSt, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: snowUpd }, 0);
      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 2.6], ["#f2", "#f3", 5.4], ["#f3", "#f4", 8.2], ["#f4", "#f1", 11.0]];
      seq.forEach(([a, b, t]) => {
        tl.to(a, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
      upd(); snowUpd();
    </script>
  </body>
</html>
