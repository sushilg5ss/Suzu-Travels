<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.1) 38%, rgba(11,31,51,0.82) 54%, rgba(11,31,51,0.95) 100%); }
      .panel { position: absolute; left: 1020px; top: 0; width: 860px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 96px; color: #d4a24c; font-weight: 800; font-size: 32px; letter-spacing: 0.14em; white-space: nowrap; }
      .t1 { position: absolute; left: 0; top: 146px; color: #fff; font-weight: 800; font-size: 96px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      .t2 { position: absolute; left: 0; top: 258px; color: #d4a24c; font-weight: 800; font-size: 96px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      svg.map { position: absolute; left: 0; top: 392px; width: 840px; height: 480px; overflow: visible; }
      svg text { font-family: "PJS", sans-serif; font-weight: 800; fill: #fff; font-size: 30px; }
      .bar { position: absolute; left: 0; top: 900px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
      .facts { position: absolute; left: 0; top: 926px; width: 860px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 860px; color: #fff; font-weight: 800; font-size: 48px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="3.4" data-track-index="0"><img id="im1" src="assets/s1.jpg" alt="" /></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="2.8" data-duration="3.4" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/s2.jpg" alt="" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="5.6" data-duration="3.4" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/s3.jpg" alt="" /></div></div>
      <div id="sc4" class="scene clip" data-layout-allow-overflow data-start="8.4" data-duration="3.4" data-track-index="3"><div id="fd4" style="position:absolute;inset:0"><img id="im4" src="assets/s4.jpg" alt="" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="11.6" data-duration="1.4" data-track-index="4"><div id="fd5" style="position:absolute;inset:0"><img id="im5" src="assets/s1.jpg" alt="" /></div></div>
      <div id="ov" class="clip" data-start="0" data-duration="13" data-track-index="5" style="position:absolute;inset:0">
        <div class="shade"></div>
        <div class="panel">
          <div class="kicker">PLACE GUIDE · KHAJJIAR, CHAMBA</div>
          <div class="t1">One meadow,</div>
          <div class="t2">six ways to play</div>
          <svg class="map" viewBox="0 0 840 480">
            <path id="route" d="M 40 70 C 200 70 230 190 360 190 C 500 190 520 110 640 110 C 720 110 760 170 790 210" fill="none" stroke="#d4a24c" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 22" />
            <circle cx="40" cy="70" r="10" fill="#d4a24c" />
            <circle cx="360" cy="190" r="7" fill="#fff" />
            <circle cx="640" cy="110" r="7" fill="#fff" />
            <ellipse cx="790" cy="222" rx="44" ry="18" fill="#3f7d3a" stroke="#d4a24c" stroke-width="4" />
            <text x="40" y="34" style="font-size:28px">Dalhousie</text>
            <text x="360" y="240" text-anchor="middle" style="font-size:24px">Lakkar Mandi</text>
            <text x="640" y="80" text-anchor="middle" style="font-size:24px">Kalatop</text>
            <text x="836" y="280" text-anchor="end" style="font-size:28px">Khajjiar ~1,920 m</text>
            <text x="30" y="170" style="font-size:22px;fill:#d4a24c;letter-spacing:3px">BY ROAD</text>
            <text id="km" x="30" y="236" style="font-size:64px">0 km</text>
            <g id="car"><circle r="13" fill="#d4a24c" stroke="#fff" stroke-width="4" /></g>
            <g id="ic1" transform="translate(70,390)"><circle r="36" fill="#0b1f33" stroke="#d4a24c" stroke-width="5"/><path d="M -20 -2 C -11 -16 11 -16 20 -2" fill="none" stroke="#d4a24c" stroke-width="6" stroke-linecap="round"/><line x1="-15" y1="-4" x2="0" y2="12" stroke="#fff" stroke-width="3"/><line x1="15" y1="-4" x2="0" y2="12" stroke="#fff" stroke-width="3"/><circle cy="16" r="4" fill="#fff"/></g>
            <g id="ic2" transform="translate(210,390)"><circle r="36" fill="#0b1f33" stroke="#d4a24c" stroke-width="5"/><circle r="20" fill="none" stroke="#fff" stroke-width="4"/><circle r="9" fill="#d4a24c"/></g>
            <g id="ic3" transform="translate(350,390)"><circle r="36" fill="#0b1f33" stroke="#d4a24c" stroke-width="5"/><path d="M -20 8 C -18 -4 -8 -8 6 -8 L 12 -18 L 18 -8 C 22 -4 22 4 18 6 L 16 20 M 12 6 L 12 20 M -16 8 L -16 20 M -8 10 L -8 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
            <g id="ic4" transform="translate(490,390)"><circle r="36" fill="#0b1f33" stroke="#d4a24c" stroke-width="5"/><path d="M -12 18 L -12 4 M -22 6 L -12 -16 L -2 6 Z" fill="#d4a24c" stroke="#d4a24c" stroke-width="2" stroke-linejoin="round"/><path d="M 12 18 L 12 2 M 2 4 L 12 -20 L 22 4 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></g>
            <g id="ic5" transform="translate(630,390)"><circle r="36" fill="#0b1f33" stroke="#d4a24c" stroke-width="5"/><path d="M -22 -2 L 0 -22 L 22 -2 Z" fill="#d4a24c"/><rect x="-15" y="-2" width="30" height="20" fill="#fff"/><rect x="-5" y="6" width="10" height="12" fill="#0b1f33"/></g>
            <g id="ic6" transform="translate(770,390)"><circle r="36" fill="#0b1f33" stroke="#d4a24c" stroke-width="5"/><g stroke="#fff" stroke-width="4" stroke-linecap="round"><line x1="0" y1="-20" x2="0" y2="20"/><line x1="-17" y1="-10" x2="17" y2="10"/><line x1="-17" y1="10" x2="17" y2="-10"/></g></g>
            <text x="70" y="456" text-anchor="middle" style="font-size:22px">Fly</text>
            <text x="210" y="456" text-anchor="middle" style="font-size:22px">Zorb</text>
            <text x="350" y="456" text-anchor="middle" style="font-size:22px">Ride</text>
            <text x="490" y="456" text-anchor="middle" style="font-size:22px">Walk</text>
            <text x="630" y="456" text-anchor="middle" style="font-size:22px">Temple</text>
            <text x="770" y="456" text-anchor="middle" style="font-size:22px">Snow</text>
          </svg>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">About 24 km from Dalhousie</div>
            <div class="fact" id="f2">Paragliding: 12+ yrs, 30 kg+</div>
            <div class="fact" id="f3">Snow on some days, Dec–Feb</div>
            <div class="fact" id="f4">One full day from Dalhousie</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.07, x: -30, duration: 3.4, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.06, y: 0 }, { scale: 1, y: -30, duration: 3.4, ease: "none" }, 2.8);
      tl.fromTo("#im3", { scale: 1, x: 0 }, { scale: 1.07, x: 30, duration: 3.4, ease: "none" }, 5.6);
      tl.fromTo("#im4", { scale: 1.07, y: 10 }, { scale: 1, y: -10, duration: 3.4, ease: "none" }, 8.4);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 2.8);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 5.6);
      tl.fromTo("#fd4", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 8.4);
      tl.fromTo("#fd5", { opacity: 0 }, { opacity: 1, duration: 1.35, ease: "sine.inOut" }, 11.6);
      tl.fromTo("#route", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -252 }, duration: 13, ease: "none" }, 0);
      const route = document.getElementById("route");
      const L = route.getTotalLength();
      const car = document.getElementById("car");
      const km = document.getElementById("km");
      function put(t) {
        const a = route.getPointAtLength(L * t);
        car.setAttribute("transform", "translate(" + a.x.toFixed(2) + "," + a.y.toFixed(2) + ")");
        km.textContent = Math.round(24 * t) + " km";
      }
      put(0);
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: 1, duration: 10.6, ease: "sine.inOut", immediateRender: false, onUpdate: () => put(st.t) }, 0.5);
      tl.to("#car", { opacity: 0, duration: 0.4, ease: "power1.in" }, 11.5);
      const rs = { t: 1 };
      tl.fromTo(rs, { t: 1 }, { t: 0, duration: 0.01, immediateRender: false, onUpdate: () => put(rs.t) }, 12.0);
      tl.to("#car", { opacity: 1, duration: 0.55, ease: "power1.out" }, 12.3);
      [["#ic1", 1.0], ["#ic2", 2.6], ["#ic3", 4.2], ["#ic4", 5.8], ["#ic5", 7.4], ["#ic6", 9.0]].forEach(([p, t]) => {
        tl.fromTo(p + " > circle", { attr: { "stroke-width": 5 } }, { attr: { "stroke-width": 12 }, duration: 0.35, ease: "power2.out", immediateRender: false }, t);
        tl.to(p + " > circle", { attr: { "stroke-width": 5 }, duration: 0.45, ease: "power2.in" }, t + 0.35);
      });
      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 3.0], ["#f2", "#f3", 6.0], ["#f3", "#f4", 9.0], ["#f4", "#f1", 12.0]];
      seq.forEach(([a, b, t]) => {
        tl.to(a, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
