<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; background: radial-gradient(1200px 700px at 80% 0%, #17395a 0%, #0b1f33 60%); }
      .k { position: absolute; left: 120px; top: 64px; color: #d4a24c; font-weight: 800; font-size: 32px; letter-spacing: 0.18em; }
      .h { position: absolute; left: 120px; top: 104px; color: #fff; font-weight: 800; font-size: 76px; letter-spacing: -0.02em; white-space: nowrap; }
      .mh { position: absolute; top: 214px; width: 86px; text-align: center; color: rgba(255,255,255,0.88); font-weight: 800; font-size: 28px; }
      .row { position: absolute; left: 120px; width: 1680px; height: 92px; }
      .name { position: absolute; left: 0; top: 14px; width: 600px; color: #fff; font-weight: 800; font-size: 38px; white-space: nowrap; }
      .note { position: absolute; left: 0; top: 58px; width: 620px; color: rgba(255,255,255,0.8); font-weight: 500; font-size: 24px; white-space: nowrap; }
      .track { position: absolute; left: 640px; top: 22px; width: 1040px; height: 48px; background: rgba(255,255,255,0.07); border-radius: 10px; }
      .bar { position: absolute; top: 22px; height: 48px; background: #d4a24c; border-radius: 10px; }
      .bar.alt { background: #7fa6c9; }
      .end { position: absolute; left: 120px; top: 990px; width: 1680px; text-align: center; color: #fff; font-weight: 800; font-size: 38px; }
      .end span { color: #d4a24c; }
      .leg { position: absolute; top: 140px; color: rgba(255,255,255,0.9); font-weight: 500; font-size: 26px; white-space: nowrap; }
      .sw { display: inline-block; width: 28px; height: 18px; border-radius: 5px; margin-right: 10px; vertical-align: -2px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11" data-width="1920" data-height="1080">
      <div id="L" class="clip" data-start="0" data-duration="11" data-track-index="0" style="position:absolute;inset:0">
        <div id="k" class="k">LAND &amp; RIDES · HIMACHAL</div>
        <div id="h" class="h">When each ride runs</div>
        <div id="leg1" class="leg" style="left:1180px"><span class="sw" style="background:#d4a24c"></span>Main season</div>
        <div id="leg2" class="leg" style="left:1460px"><span class="sw" style="background:#7fa6c9"></span>Winter 4×4 tours</div>
        <div id="mrow"></div>
        <div id="rows"></div>
        <div id="end" class="end">One quote for the ride + hotel + cab · <span>Get Quote</span></div>
      </div>
    </div>
    <script>
      const M = "JFMAMJJASOND".split("");
      const X0 = 760, W = 1040 / 12;
      const mrow = document.getElementById("mrow");
      M.forEach((m, i) => { const d = document.createElement("div"); d.className = "mh"; d.style.left = (X0 + i * W) + "px"; d.textContent = m; mrow.appendChild(d); });
      // [name, note, [[startMonthIndex, endMonthIndexExclusive, alt?], ...]]  — facts from the hub's own Land & Rides cards
      const data = [
        ["ATV quad bike rides", "Solang Valley and Kufri", [[0, 12]]],
        ["Horse and yak rides", "Kufri, Solang, Khajjiar, Gulaba", [[0, 12]]],
        ["Zorbing", "Solang · grass in summer, snow in winter", [[0, 12]]],
        ["Rock climbing", "Manali, Dharamshala, Bir · age 10+", [[2, 6], [8, 11]]],
        ["Spiti bike trips", "Manali or Shimla to Kaza", [[4, 10]]],
        ["Jeep safari in Spiti", "Kaza, Langza, Hikkim, Komic", [[4, 10], [0, 3, 1], [11, 12, 1]]],
        ["Mountain biking", "Manali–Spiti roads, around Bir", [[4, 10]]]
      ];
      const rows = document.getElementById("rows");
      data.forEach((r, i) => {
        const row = document.createElement("div"); row.className = "row"; row.id = "r" + i; row.style.top = (262 + i * 100) + "px";
        row.innerHTML = '<div class="name">' + r[0] + '</div><div class="note">' + r[1] + '</div><div class="track"></div>';
        r[2].forEach((b, j) => {
          const e = document.createElement("div"); e.className = "bar" + (b[2] ? " alt" : ""); e.id = "b" + i + "_" + j;
          e.style.left = (640 + b[0] * W + 2) + "px"; e.style.width = ((b[1] - b[0]) * W - 4) + "px"; row.appendChild(e);
        });
        rows.appendChild(row);
      });
      const tl = gsap.timeline({ paused: true });
      tl.from(["#k", "#h"], { opacity: 0, y: 30, duration: 0.6, stagger: 0.12, ease: "power3.out" }, 0);
      tl.from(".mh", { opacity: 0, y: -10, duration: 0.3, stagger: 0.03 }, 0.5);
      tl.from(["#leg1", "#leg2"], { opacity: 0, duration: 0.4, stagger: 0.1 }, 0.7);
      data.forEach((r, i) => {
        const t = 1.0 + i * 1.0;
        tl.from("#r" + i + " .name, #r" + i + " .note, #r" + i + " .track", { opacity: 0, x: -30, duration: 0.45, stagger: 0.06, ease: "power3.out" }, t);
        tl.from("#r" + i + " .bar", { scaleX: 0, transformOrigin: "left center", duration: 0.6, stagger: 0.12, ease: "power2.out" }, t + 0.25);
      });
      tl.from("#end", { opacity: 0, y: 20, duration: 0.5, ease: "power3.out" }, 8.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
