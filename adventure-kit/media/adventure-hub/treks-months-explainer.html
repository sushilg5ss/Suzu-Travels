<!doctype html>

    <style>

      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; background: #0b1f33; }

      svg.g { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
      .note { position: absolute; left: 110px; top: 880px; color: rgba(255,255,255,0.9); font-weight: 500; font-size: 30px; white-space: nowrap; }
      .note b { color: #d4a24c; }
      .small { position: absolute; left: 110px; top: 990px; color: rgba(255,255,255,0.6); font-weight: 500; font-size: 24px; white-space: nowrap; }
      .chip { position: absolute; right: 110px; top: 968px; background: #d4a24c; color: #0b1f33; font-weight: 800; font-size: 30px; padding: 14px 28px; border-radius: 40px; white-space: nowrap; }
    </style>

        <div class="note" id="note">Low walks run spring to autumn. <b>High passes (Sar, Indrahar, Buran Ghati): May–Jun and Sep–Oct.</b></div>

    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#kick", { opacity: 0, y: -16, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.from("#title", { opacity: 0, y: 24, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.from(".mh", { opacity: 0, y: 12, duration: 0.3, stagger: 0.04, ease: "power2.out" }, 0.5);
      tl.from(".lab", { opacity: 0, x: -30, duration: 0.4, stagger: 0.12, ease: "power2.out" }, 0.9);
      tl.from(".bar", { scaleX: 0, transformOrigin: "0% 50%", duration: 0.6, stagger: 0.18, ease: "power2.out" }, 1.5);
      tl.from("#note", { opacity: 0, y: 16, duration: 0.5 }, 5.0);
      tl.from("#small", { opacity: 0, duration: 0.5 }, 5.6);
      tl.fromTo("#chip", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 6.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
