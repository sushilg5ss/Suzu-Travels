<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "PJS"; src: url("assets/plus-jakarta-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #0b1f33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "PJS", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene img { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,31,51,0) 0%, rgba(11,31,51,0.1) 38%, rgba(11,31,51,0.82) 54%, rgba(11,31,51,0.95) 100%); }
      .panel { position: absolute; left: 1020px; top: 0; width: 860px; height: 1080px; }
      .kicker { position: absolute; left: 0; top: 96px; color: #d4a24c; font-weight: 800; font-size: 32px; letter-spacing: 0.14em; white-space: nowrap; }
      .t1 { position: absolute; left: 0; top: 146px; color: #fff; font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      .t2 { position: absolute; left: 0; top: 256px; color: #d4a24c; font-weight: 800; font-size: 92px; line-height: 1.02; letter-spacing: -0.02em; white-space: nowrap; }
      svg.map { position: absolute; left: 0; top: 400px; width: 840px; height: 470px; overflow: visible; }
      .lab { position: absolute; color: #fff; font-weight: 800; font-size: 36px; white-space: nowrap; }
      .lab.town { font-weight: 500; font-size: 28px; color: rgba(255,255,255,0.85); }
      .bar { position: absolute; left: 0; top: 900px; width: 120px; height: 8px; background: #d4a24c; border-radius: 4px; }
      .facts { position: absolute; left: 0; top: 926px; width: 860px; height: 80px; }
      .fact { position: absolute; left: 0; top: 0; width: 860px; color: #fff; font-weight: 800; font-size: 50px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="sc1" class="scene clip" data-layout-allow-overflow data-start="0" data-duration="3.8" data-track-index="0"><img id="im1" src="assets/s1.jpg" alt="" /></div>
      <div id="sc2" class="scene clip" data-layout-allow-overflow data-start="3" data-duration="3.8" data-track-index="1"><div id="fd2" style="position:absolute;inset:0"><img id="im2" src="assets/s2.jpg" alt="" /></div></div>
      <div id="sc3" class="scene clip" data-layout-allow-overflow data-start="6" data-duration="3.8" data-track-index="2"><div id="fd3" style="position:absolute;inset:0"><img id="im3" src="assets/s3.jpg" alt="" /></div></div>
      <div id="sc4" class="scene clip" data-layout-allow-overflow data-start="9" data-duration="3" data-track-index="3"><div id="fd4" style="position:absolute;inset:0"><img id="im4" src="assets/s4.jpg" alt="" /></div></div>
      <div id="sc5" class="scene clip" data-layout-allow-overflow data-start="10.8" data-duration="1.2" data-track-index="4"><div id="fd5" style="position:absolute;inset:0"><img id="im5" src="assets/s1.jpg" alt="" /></div></div>
      <div id="ov" class="clip" data-start="0" data-duration="12" data-track-index="5" style="position:absolute;inset:0">
        <div class="shade"></div>
        <div class="panel">
          <div class="kicker">WATER · BEAS RIVER · KULLU</div>
          <div class="t1">River Rafting</div>
          <div class="t2">in Kullu Manali</div>
          <svg class="map" viewBox="0 0 840 470">
            <path id="riverbed" d="M 60 30 C 220 40 300 110 330 190 C 360 270 470 300 560 330 C 660 365 720 410 800 450" fill="none" stroke="rgba(120,180,230,0.35)" stroke-width="30" stroke-linecap="round" />
            <path id="flow" d="M 60 30 C 220 40 300 110 330 190 C 360 270 470 300 560 330 C 660 365 720 410 800 450" fill="none" stroke="rgba(220,240,255,0.85)" stroke-width="5" stroke-linecap="round" stroke-dasharray="18 26" />
            <rect x="48" y="18" width="24" height="24" rx="4" fill="#fff" stroke="#0b1f33" stroke-width="3" />
            <circle class="pin" id="pR" cx="230" cy="62" r="14" fill="#d4a24c" stroke="#0b1f33" stroke-width="4" />
            <circle class="pin" id="pB" cx="420" cy="282" r="14" fill="#d4a24c" stroke="#0b1f33" stroke-width="4" />
            <rect x="508" y="300" width="24" height="24" rx="4" fill="#fff" stroke="#0b1f33" stroke-width="3" />
            <circle class="pin" id="pP" cx="660" cy="372" r="14" fill="#d4a24c" stroke="#0b1f33" stroke-width="4" />
            <g id="raft">
              <rect x="-26" y="-11" width="52" height="22" rx="11" fill="#d4a24c" stroke="#0b1f33" stroke-width="3" />
              <line x1="-10" y1="-11" x2="-18" y2="-26" stroke="#fff" stroke-width="4" stroke-linecap="round" />
              <line x1="10" y1="-11" x2="18" y2="-26" stroke="#fff" stroke-width="4" stroke-linecap="round" />
            </g>
          </svg>
          <div class="lab town" style="left:20px; top:446px">Manali</div>
          <div class="lab" id="lR" style="left:258px; top:420px">Raisan</div>
          <div class="lab" id="lB" style="left:272px; top:664px">Babeli</div>
          <div class="lab town" style="left:470px; top:756px">Kullu</div>
          <div class="lab" id="lP" style="left:702px; top:704px">Pirdi</div>
          <div class="bar"></div>
          <div class="facts">
            <div class="fact" id="f1">3 rafting points on the Beas</div>
            <div class="fact" id="f2">Routes about 7–14 km</div>
            <div class="fact" id="f3">Life jacket + helmet, always</div>
            <div class="fact" id="f4">Closed 15 Jul – 15 Sep</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#im1", { scale: 1, x: 0 }, { scale: 1.07, x: -30, duration: 3.8, ease: "none" }, 0);
      tl.fromTo("#im2", { scale: 1.06, y: 0 }, { scale: 1, y: -30, duration: 3.8, ease: "none" }, 3);
      tl.fromTo("#im3", { scale: 1, x: 0 }, { scale: 1.07, x: 30, duration: 3.8, ease: "none" }, 6);
      tl.fromTo("#im4", { scale: 1.07, y: 10 }, { scale: 1, y: -10, duration: 3, ease: "none" }, 9);
      tl.fromTo("#fd2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 3);
      tl.fromTo("#fd3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 6);
      tl.fromTo("#fd4", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 9);
      tl.fromTo("#fd5", { opacity: 0 }, { opacity: 1, duration: 1.15, ease: "sine.inOut" }, 10.8);

      // water flow: offset moves 6 dash periods (44 px each) over 12 s -> seamless loop
      tl.fromTo("#flow", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -264 }, duration: 12, ease: "none" }, 0);

      const route = document.getElementById("flow");
      const L = route.getTotalLength();
      const raft = document.getElementById("raft");
      function put(t) {
        const a = route.getPointAtLength(L * t);
        const b = route.getPointAtLength(Math.min(L, L * t + 2));
        const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
        raft.setAttribute("transform", "translate(" + a.x.toFixed(2) + "," + a.y.toFixed(2) + ") rotate(" + (ang * 0.5).toFixed(2) + ")");
      }
      put(0.12);
      const st = { t: 0.12 };
      tl.fromTo(st, { t: 0.12 }, { t: 0.92, duration: 9.8, ease: "sine.inOut", immediateRender: false, onUpdate: () => put(st.t) }, 0.4);
      [["#pR", 0.9], ["#pB", 5.0], ["#pP", 8.6]].forEach(([p, t]) => {
        tl.fromTo(p, { attr: { r: 14 } }, { attr: { r: 22 }, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
        tl.to(p, { attr: { r: 14 }, duration: 0.4, ease: "power2.in" }, t + 0.3);
      });
      tl.to("#raft", { opacity: 0, duration: 0.4, ease: "power1.in" }, 10.4);
      const rs = { t: 0.92 };
      tl.fromTo(rs, { t: 0.92 }, { t: 0.12, duration: 0.01, immediateRender: false, onUpdate: () => put(rs.t) }, 11.0);
      tl.to("#raft", { opacity: 1, duration: 0.55, ease: "power1.out" }, 11.3);

      tl.set(["#f2", "#f3", "#f4"], { opacity: 0 }, 0);
      const seq = [["#f1", "#f2", 2.6], ["#f2", "#f3", 5.4], ["#f3", "#f4", 8.2], ["#f4", "#f1", 11.0]];
      seq.forEach(([a, b, t]) => {
        tl.to(a, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, t);
        tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t + 0.35);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
