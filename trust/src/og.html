<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Sora;font-weight:800;src:url(node_modules/@fontsource/sora/files/sora-latin-800-normal.woff2)}
@font-face{font-family:Sora;font-weight:700;src:url(node_modules/@fontsource/sora/files/sora-latin-700-normal.woff2)}
@font-face{font-family:PJS;font-weight:600;src:url(node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-600-normal.woff2)}
@font-face{font-family:PJS;font-weight:800;src:url(node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:radial-gradient(120% 140% at 0% 0%,#1f6b26 0%,#153a1b 45%,#0d1f10 100%);font-family:PJS,sans-serif;color:#fff;position:relative}
.ring{position:absolute;border:1.5px solid rgba(212,175,55,.18);border-radius:50%}
.l{position:absolute;left:64px;top:70px;width:600px}
.pill{display:inline-flex;align-items:center;gap:10px;background:#D4AF37;color:#122615;font:800 15px/1 PJS;letter-spacing:.16em;text-transform:uppercase;padding:10px 16px;border-radius:999px}
.pill i{width:8px;height:8px;border-radius:50%;background:#122615;display:block}
h1{font:800 64px/1.02 Sora;letter-spacing:-.035em;margin:26px 0 22px}
h1 em{font-style:normal;color:#f3d98f}
.row{display:flex;flex-direction:column;gap:12px;margin-bottom:30px}
.row div{display:flex;align-items:center;gap:12px;font:600 21px/1.3 PJS;color:#E6EFE8}
.row b{font-weight:800;color:#fff}
.tick{width:30px;height:30px;border-radius:9px;background:rgba(212,175,55,.16);border:1.5px solid rgba(212,175,55,.55);display:grid;place-items:center;flex:none}
.tick svg{width:17px;height:17px}
.url{font:700 19px/1 Sora;color:#D4AF37;letter-spacing:.01em}
.cards{position:absolute;right:40px;top:58px;width:470px;height:520px}
.c{position:absolute;background:#fff;border-radius:10px;box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.2);overflow:hidden}
.c img{display:block;width:100%}
.gst{width:270px;right:10px;top:0;transform:rotate(5deg)}
.hpt{width:420px;left:0;top:210px;transform:rotate(-4deg)}
.seal{position:absolute;right:26px;bottom:34px;width:118px;height:118px;border-radius:50%;background:#D4AF37;color:#122615;display:grid;place-items:center;text-align:center;font:800 12.5px/1.2 PJS;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 14px 30px rgba(0,0,0,.4);border:4px solid #f3d98f}
</style></head><body>

</div>
</body></html>
