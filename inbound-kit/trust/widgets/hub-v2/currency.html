<!--szv:currency--><div class="szx" id="szCur"><style>.szx{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 18px;font-family:'Plus Jakarta Sans',system-ui,sans-serif}.szx span{font-size:13px;font-weight:700;color:#55645A;margin-right:4px}.szx button{border:1px solid #DCD6C6;background:#fff;color:#0E1B14;font:800 13px/1 'Plus Jakarta Sans',sans-serif;padding:9px 12px;border-radius:999px;cursor:pointer}.szx button[aria-pressed=true]{background:#0E1B14;color:#F0D57A;border-color:#0E1B14}.szx em{font-style:normal;font-size:12px;color:#6B776E;flex-basis:100%}.lp-price .szc-x{display:block;font-size:13px;color:#6B776E;font-weight:600;margin-top:2px}</style><span>Show prices in</span><button type="button" data-c="USD" aria-pressed="true">US$</button><button type="button" data-c="GBP" aria-pressed="false">£ GBP</button><button type="button" data-c="EUR" aria-pressed="false">€ EUR</button><button type="button" data-c="AUD" aria-pressed="false">A$ AUD</button><button type="button" data-c="CAD" aria-pressed="false">C$ CAD</button><em>Approximate conversions at today's European Central Bank rate. Quotes and payment are in US$.</em><script>(function(){var box=document.getElementById('szCur');if(!box){return;}var S={USD:'US$',GBP:'£',EUR:'€',AUD:'A$',CAD:'C$'};var R=null;function each(fn){var b=document.querySelectorAll('.lp-price b');for(var i=0;i<b.length;i++){fn(b[i]);}}function show(c){var btn=box.querySelectorAll('button');for(var i=0;i<btn.length;i++){btn[i].setAttribute('aria-pressed',btn[i].getAttribute('data-c')===c?'true':'false');}each(function(b){var p=b.parentNode;var x=p.querySelector('.szc-x');if(!x){x=document.createElement('span');x.className='szc-x';p.appendChild(x);}var n=parseFloat((b.textContent||'').replace(/[^0-9.]/g,''));if(c==='USD'||!R||!R[c]||!n){x.textContent='';return;}x.textContent='≈ '+S[c]+Math.round(n*R[c]).toLocaleString('en-GB')+' (approx.)';});}box.addEventListener('click',function(e){var c=e.target.getAttribute('data-c');if(!c){return;}if(R||c==='USD'){show(c);return;}var u='https:'+String.fromCharCode(47,47)+'api.frankfurter.dev/v1/latest?base=USD';fetch(u).then(function(r){return r.json();}).then(function(j){R=j.rates;show(c);}).catch(function(){box.querySelector('em').textContent='Live rates unavailable right now — all quotes are in US$.';});});})();</script></div><!--/szv:currency-->
